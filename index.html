<!DOCTYPE html>
<!--
  랜덤 타워디펜스 — 유즈맵 감성 프로토타입.

  취향에서 출발했다: 병수님은 스타/워크 **유즈맵**을 재밌어했고, 재미의 축 넷 중에서는
  **①숫자가 불어나는 것**에 손이 제일 오래 갔다. 그 교집합이 이것이다.

  루프는 유즈맵 랜타디 그대로다:
      뽑는다 → 합친다 → 배치한다 → 웨이브가 자동으로 온다 → 골드 → 또 뽑는다

  네 가지가 각각 다른 재미를 맡는다. 하나라도 빠지면 나머지가 심심해진다.
    뽑기   무엇이 나올까 (도파민, 매번 다르다)
    합성   같은 것 셋 → 한 등급 위. **숫자가 커지는 맛**이 여기 있다
    배치   길에서 먼 자리는 사거리가 닿지 않는다 — 공짜가 아니다
    관전   내가 짜 놓은 것이 나 없이 막는 걸 지켜본다

  판정할 질문: **다음 라운드를 누르고 싶은가.**
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>랜덤 타워디펜스</title>
<style>
  :root{--bg:#0b0d10;--panel:#12151a;--line:#232830;--fg:#c6ccd4;--dim:#6b7480;
    --amber:#e0a458;--good:#7fb069;--bad:#d05353;--steel:#6ba8d6;--magic:#a978c9}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"D2Coding","Menlo","Noto Sans Mono CJK KR",monospace;font-size:14px;
    display:flex;flex-direction:column;user-select:none}
  header{display:flex;align-items:baseline;gap:14px;padding:9px 16px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .title{color:var(--amber);letter-spacing:3px;font-weight:bold}
  .sub{color:var(--dim);font-size:12px}
  .hud{margin-left:auto;display:flex;gap:18px;font-size:13px}
  .hud b{color:var(--amber);font-weight:normal}
  .hud .life b{color:var(--bad)}
  main{flex:1;display:flex;min-height:0}

  /* ── 전장 ── */
  #field{position:relative;flex:1;min-width:0;background:#0e1116;overflow:hidden}
  #grid{position:absolute;inset:0}
  .tile{position:absolute;border-radius:2px}
  /* **길은 한 줄기로 이어져 보여야 한다.** 칸마다 틈이 있으면 몹이 어디로 가는지 안 읽히고,
     그러면 어디에 놓을지가 감이 아니라 운이 된다(첫 판에서 실제로 그랬다).
     그래서 길 타일만 틈 없이 붙이고 한 단계 밝게 깐다. */
  .tile.road{background:#2b3543;border-radius:0}
  /* **놓을 수 있는 자리는 한눈에 갈려야 한다.** 바깥 땅과 색이 비슷하면 어디까지가 내
     터인지 몰라 배치가 감이 된다. 터는 밝게 깔고, 적이 달려오는 바깥은 거의 배경으로 둔다. */
  .tile.slot{background:#1e2630;border:1px solid #2c3745;cursor:pointer}
  .tile.wild{background:#0b0e12;border:1px solid #0f1319}
  .tile.slot:hover{border-color:var(--amber)}
  .tile.slot.sel{border-color:var(--amber);background:#1e1c16}
  .mark{position:absolute;font-size:11px;color:var(--dim);pointer-events:none;letter-spacing:1px}
  /* 본진 — 칸을 쪼개지 않고 한 덩이로. 조각으로 두면 지킬 것이 아니라 타일로 읽힌다. */
  .core{position:absolute;background:#1c2530;border:1px solid #3d5468;border-radius:3px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    pointer-events:none;box-shadow:0 0 0 1px rgba(107,168,214,.18) inset}
  .core .cname{color:var(--steel);font-size:12px;letter-spacing:2px}
  .core .cbar{width:74%;height:7px;background:#141a22;border-radius:2px;overflow:hidden}
  .core .cbar i{display:block;height:100%;background:linear-gradient(90deg,#4a6b3f,#7fb069);transition:width .15s}
  .core .cnum{font-size:11px;color:var(--dim)}
  /* 타워도 맞는다 — 얼마나 성한지가 보여야 "저건 빼자"가 결정이 된다 */
  .tw .thp{position:absolute;left:4px;right:4px;bottom:2px;height:2px;background:#2a3038;border-radius:1px}
  .tw .thp i{display:block;height:100%;background:#7fb069;border-radius:1px}

  .tw{position:absolute;display:flex;flex-direction:column;align-items:center;
    justify-content:center;border-radius:3px;pointer-events:none;font-size:16px;line-height:1}
  .tw .lvl{font-size:9px;margin-top:2px;opacity:.85}
  .mob{position:absolute;border-radius:50%;pointer-events:none;transition:none}
  .mob i{position:absolute;left:0;top:-6px;height:3px;background:var(--good);border-radius:2px}
  .mob.boss{box-shadow:0 0 0 2px var(--bad)}
  .shot{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none}
  .rng{position:absolute;border-radius:50%;border:1px dashed #3f4a58;pointer-events:none}
  .fly{position:absolute;font-size:11px;color:var(--amber);pointer-events:none;
    animation:fly .7s ease-out forwards}
  @keyframes fly{to{transform:translateY(-22px);opacity:0}}

  /* ── 옆 패널 ── */
  aside{width:290px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);
    padding:12px 14px;overflow-y:auto}
  aside h3{margin:0 0 7px;font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:normal}
  aside section{margin-bottom:15px}
  button{font-family:inherit;font-size:13px;cursor:pointer;color:var(--fg);
    background:#1a2029;border:1px solid #333c48;border-radius:4px;padding:8px 12px}
  button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
  button:disabled{opacity:.32;cursor:default}
  .wide{width:100%}
  .roll{padding:13px;font-size:15px}
  .roll .c{color:var(--good)}
  .rowbtn{display:flex;gap:8px;margin-top:8px}
  .note{color:var(--dim);font-size:11px;line-height:1.6;margin-top:7px}
  .sel-info{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:9px}
  .sel-info .nm{color:var(--amber)}
  .sel-info .st{color:var(--dim);font-size:12px;line-height:1.6;margin-top:4px}
  ul.tally{list-style:none;margin:0;padding:0;font-size:12px}
  ul.tally li{display:flex;justify-content:space-between;padding:2px 0}
  ul.tally li span:last-child{color:var(--dim)}
  ul.tally li.ready span:last-child{color:var(--good)}
  #log{font-size:11px;color:var(--dim);line-height:1.65;max-height:150px;overflow-y:auto}
  #log b{color:var(--amber);font-weight:normal}
  #over{position:absolute;inset:0;background:rgba(6,8,10,.88);display:none;
    align-items:center;justify-content:center;text-align:center}
  #over.on{display:flex}
  #over h2{color:var(--amber);font-weight:normal;letter-spacing:2px;margin:0 0 8px}
  #over>div{max-width:520px}
  .shopwrap h3{font-size:12px;letter-spacing:1px;color:var(--dim);font-weight:normal;margin:18px 0 8px}
  .shopwrap h3 b{color:var(--amber);font-weight:normal}
  .shop{display:grid;gap:7px;text-align:left}
  .up{display:flex;align-items:center;gap:11px;padding:9px 12px}
  .up .n{color:var(--amber);width:74px;flex-shrink:0}
  .up .d{flex:1;color:var(--dim);font-size:12px}
  .up .p{color:var(--good);font-size:12px}
  .up:disabled .p{color:var(--dim)}
</style>
</head>
<body>
<header>
  <span class="title">랜덤 타워디펜스</span>
  <span class="sub">뽑고 · 합치고 · 막는다</span>
  <div class="hud">
    <span>라운드 <b id="hRound">1</b></span>
    <span>골드 <b id="hGold">0</b></span>
    <span class="life">본진 <b id="hLife">—</b></span>
    <span>유물 <b id="hRelic">0</b></span>
  </div>
</header>

<main>
  <div id="field">
    <div id="grid"></div>
    <div id="over"><div>
      <h2 id="overT"></h2>
      <div class="note" id="overD" style="font-size:13px"></div>
      <div class="shopwrap">
        <h3>유물로 영구히 세진다 <span class="dim">(가진 유물 <b id="shopHave">0</b>)</span></h3>
        <div class="shop" id="shop"></div>
      </div>
      <button id="again" style="margin-top:16px;padding:11px 26px">한 판 더</button>
    </div></div>
  </div>

  <aside>
    <section>
      <button class="wide roll" id="rollBtn">뽑는다 <span class="c" id="rollCost"></span></button>
      <div class="note" id="rollNote"></div>
      <div class="note" style="margin-top:10px;color:#5f6874">
        가운데 <b style="color:var(--steel)">본진</b>을 지킨다. 적은 <b>사방에서</b> 곧장 밀려온다.<br>
        가는 길에 타워가 있으면 <b>그걸 먼저</b> 친다 — 바깥에 세우면 방벽이 되지만 얻어맞는다.<br>
        웨이브가 끝나면 성한 것은 스스로 추스른다.
      </div>
    </section>

    <section>
      <h3>다음 웨이브</h3>
      <button class="wide" id="waveBtn"></button>
      <div class="note" id="waveNote"></div>
    </section>

    <section>
      <h3>가진 것</h3>
      <ul class="tally" id="tally"></ul>
      <div class="rowbtn">
        <button id="mergeBtn" style="flex:1">셋을 합친다</button>
        <button id="sellBtn">판다</button>
      </div>
      <div class="note">같은 등급 셋이 모이면 한 등급 위가 된다.</div>
      <div id="selInfo"></div>
    </section>

    <section>
      <h3>기록</h3>
      <div id="log"></div>
    </section>
  </aside>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   유닛 — 등급이 오르면 **눈에 띄게** 세져야 한다.
   합성이 "조금 나아짐"이면 셋을 모을 이유가 없다. 등급마다 피해가 3배씩 뛴다.
   대신 사거리·속도는 종류가 정한다 — 그래야 어느 종류를 키울지가 선택이 된다.
   ══════════════════════════════════════════════════════════ */
const KINDS = {
  gun:   { n:"총",   ico:"⌖", col:"#c9ccd1", dmg:6,  rng:140, cd:0.55, d:"고르게 쏜다" },
  cannon:{ n:"포",   ico:"◉", col:"#d0785a", dmg:22, rng:118, cd:1.5,  splash:44, d:"느리지만 범위" },
  frost: { n:"서리", ico:"❆", col:"#6ba8d6", dmg:4,  rng:132, cd:0.7,  slow:0.45, d:"느리게 만든다" },
  bolt:  { n:"번개", ico:"⚡", col:"#a978c9", dmg:11, rng:172, cd:0.9,  chain:2, d:"멀리, 여럿에게" },
};
const KIND_IDS = Object.keys(KINDS);
const GRADE = [1,2,3,4,5];
const gradeMul = (g) => Math.pow(3, g - 1);          // 1 · 3 · 9 · 27 · 81
const GNAME = ["", "하급", "중급", "상급", "정예", "전설"];
const GCOL  = ["", "#8a8f98", "#7fb069", "#6ba8d6", "#a978c9", "#e0a458"];

const dmgOf  = (t) => Math.round(KINDS[t.kind].dmg * gradeMul(t.g) * metaDmg());
const rngOf  = (t) => KINDS[t.kind].rng + (t.g - 1) * 9;
const sellOf = (t) => Math.round(12 * gradeMul(t.g) * 0.55);
// 타워도 맞는다. 등급이 오르면 단단해지되 피해만큼 뛰지는 않는다 —
// 세다고 안 부서지면 바깥에 세우는 데 값이 없어진다.
const hpOf   = (t) => Math.round(28 + t.g * 22);

/* ══════════════════════════════════════════════════════════════
   전장 — **벙커디펜스.**
   ──────────────────────────────────────────────────────────────
   길을 따라가는 타워디펜스에서는 배치가 사실상 "길 옆이냐 아니냐" 하나뿐이다.
   가운데 지킬 것을 놓고 **사방에서 몰려오게** 하면 배치가 진짜 결정이 된다 —
   한쪽에 몰아 세우면 반대쪽이 그대로 뚫리고, 고르게 펴면 어디도 두껍지 않다.

   그리고 **타워가 방벽 노릇을 한다.** 적은 가는 길에 타워가 있으면 그걸 먼저 친다.
   그래서 바깥에 세운 것은 일찍 요격하지만 얻어맞고, 안쪽에 세운 것은 안전하지만
   본진이 먼저 맞는다. 이게 벙커디펜스의 결이다.
   ══════════════════════════════════════════════════════════ */
const COLS = 13, ROWS = 9;
const CORE = { x: 5, y: 3, w: 3, h: 3 };          // 가운데 3×3 이 본진
const inCore = (x, y) => x >= CORE.x && x < CORE.x + CORE.w && y >= CORE.y && y < CORE.y + CORE.h;
const coreKey = new Set();
for (let y = CORE.y; y < CORE.y + CORE.h; y++)
  for (let x = CORE.x; x < CORE.x + CORE.w; x++) coreKey.add(x + "," + y);

/** **놓을 수 있는 곳은 본진 둘레뿐이다.**
 *  판 전체를 열어 두면 뽑은 것이 아무 데나 떨어져 대부분 헛돈다 — 사거리가 안 닿으니
 *  가진 타워의 절반이 장식이 되고, 사람은 매번 일일이 옮겨야 한다(실제로 그랬다).
 *  둘레로 좁히면 "어느 쪽을 두껍게 할까"라는 진짜 결정만 남는다. 바깥 땅은 적이 달려오는
 *  자리로 비워 둔다 — 요격할 시간이 거기서 나온다. */
const RING = 2;
const buildable = (x, y) =>
  !inCore(x, y) &&
  x >= CORE.x - RING && x < CORE.x + CORE.w + RING &&
  y >= CORE.y - RING && y < CORE.y + CORE.h + RING;

/* ══════════════════════════════════════════════════════════════
   판을 넘어서는 성장 — **"한 판 더"를 만드는 것**
   ──────────────────────────────────────────────────────────────
   뚫리면 아무것도 안 남으면, 벽을 만난 순간이 그냥 끝이다. 도달한 만큼 유물을 주고
   그걸로 영구히 세지게 하면 **같은 벽이 "다음 판에 넘을 것"으로 바뀐다.**
   재미의 축 넷 중 ①불어난다에 손이 제일 오래 간 이유가 이 구조(환생)였다.
   ══════════════════════════════════════════════════════════ */
const META_KEY = "rtd.meta.v1";
const UPGRADES = {
  gold:  { n:"밑천",   d:"시작 골드 +25",       base:3, per:2 },
  dmg:   { n:"벼림",   d:"모든 피해 +8%",       base:4, per:3 },
  life:  { n:"성벽",   d:"본진 체력 +40",       base:3, per:2 },
  cheap: { n:"흥정",   d:"뽑기 값 -1 (바닥 6)", base:5, per:4 },
  start: { n:"선발대", d:"시작할 때 중급 하나", base:6, per:6 },
};
const META = loadMeta();
function loadMeta() {
  try {
    const raw = JSON.parse(localStorage.getItem(META_KEY));
    if (raw && typeof raw === "object") {
      return { relics: raw.relics | 0, best: raw.best | 0,
               up: Object.fromEntries(Object.keys(UPGRADES).map(k => [k, (raw.up?.[k]) | 0])) };
    }
  } catch { /* 손상됐으면 조용히 새로 시작 — 저장이 깨졌다고 게임이 안 켜지면 안 된다 */ }
  return { relics: 0, best: 0, up: Object.fromEntries(Object.keys(UPGRADES).map(k => [k, 0])) };
}
const saveMeta = () => { try { localStorage.setItem(META_KEY, JSON.stringify(META)); } catch {} };
const upCost = (k) => UPGRADES[k].base + UPGRADES[k].per * META.up[k];
// 넘긴 라운드가 곧 보상이다. 보스 라운드(5의 배수)를 넘기면 덤이 붙는다.
const relicsFor = (round) => Math.floor((round - 1) / 2) + Math.floor((round - 1) / 5) * 2;
const metaGold = () => 90 + META.up.gold * 25;
const metaLife = () => 260 + META.up.life * 40;   // 본진 체력
const metaDmg  = () => 1 + META.up.dmg * 0.08;

/* ══ 상태 ══ */
const S = {
  gold: 90, life: 20, coreHp: 0, coreMax: 0, round: 1, rolls: 0,
  towers: [],       // { id, kind, g, x, y }  (x,y = 격자 슬롯)
  mobs: [], shots: [],
  running: false, spawned: 0, toSpawn: 0, spawnT: 0,
  sel: null, over: false,
};
let nextId = 1;

const rollCost = () => Math.max(6, 12 - META.up.cheap) + S.rolls * 2;   // 뽑을수록 비싸진다
const waveHp   = (r) => Math.round(24 * Math.pow(1.30, r - 1));
const waveN    = (r) => 3 + Math.floor(r * 1.1);
const isBossR  = (r) => r % 5 === 0;

/* ══ 화면 크기 ══ */
let CELL = 56, OX = 0, OY = 0;
function layout() {
  const f = $("field").getBoundingClientRect();
  CELL = Math.floor(Math.min(f.width / COLS, f.height / ROWS));
  OX = Math.round((f.width  - CELL * COLS) / 2);
  OY = Math.round((f.height - CELL * ROWS) / 2);
  drawGrid();
}
const px = (gx) => OX + gx * CELL;
const py = (gy) => OY + gy * CELL;
const cx = (gx) => px(gx) + CELL / 2;
const cy = (gy) => py(gy) + CELL / 2;

function drawGrid() {
  let h = "";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (inCore(x, y)) continue;                    // 본진은 아래에서 한 덩이로 그린다
    const ok = buildable(x, y);
    h += `<div class="tile ${ok ? "slot" : "wild"}" ${ok ? `data-x="${x}" data-y="${y}"` : ""}
      style="left:${px(x)}px;top:${py(y)}px;width:${CELL-2}px;height:${CELL-2}px"></div>`;
  }
  // 본진 — 칸을 쪼개지 않고 **한 덩이**로 그린다. 조각으로 두면 지킬 것이 아니라 타일로 읽힌다.
  h += `<div class="core" id="coreEl"
    style="left:${px(CORE.x)}px;top:${py(CORE.y)}px;width:${CELL*CORE.w-2}px;height:${CELL*CORE.h-2}px">
      <div class="cname">본진</div>
      <div class="cbar"><i id="coreBar"></i></div>
      <div class="cnum" id="coreNum"></div>
    </div>`;
  $("grid").innerHTML = h;
  drawTowers();
}

/* ══ 로그 ══ */
const say = (html) => {
  $("log").insertAdjacentHTML("afterbegin", `<div>${html}</div>`);
  while ($("log").children.length > 30) $("log").lastChild.remove();
};

/* ══════════════════════════════════════════════════════════════
   뽑기 — 이 게임의 도파민.
   라운드가 오를수록 좋은 게 나올 확률이 오른다. 안 그러면 후반에도 하급만 나와
   "뽑는다"가 벌금이 된다. 다만 상급 이상은 뽑기로 못 나온다 — **합성만이 길**이어야
   셋을 모으는 행동에 값이 생긴다.
   ══════════════════════════════════════════════════════════ */
function roll() {
  const c = rollCost();
  if (S.gold < c) return;
  const free = freeSlots();
  if (!free.length) { say("놓을 자리가 없다."); return; }
  S.gold -= c; S.rolls++;

  const kind = KIND_IDS[Math.floor(Math.random() * KIND_IDS.length)];
  const p = Math.random() + Math.min(0.30, S.round * 0.022);
  const g = p > 1.12 ? 2 : 1;                    // 뽑기로는 중급까지만
  const slot = free[Math.floor(Math.random() * free.length)];
  const t = { id: nextId++, kind, g, x: slot.x, y: slot.y };
  t.hp = t.maxHp = hpOf(t);
  S.towers.push(t);
  S.sel = t.id;
  say(`<b>${GNAME[g]} ${KINDS[kind].n}</b> 을(를) 뽑았다.`);
  refresh();
}

const occupied = () => new Set(S.towers.map(t => t.x+","+t.y));
function freeSlots() {
  const occ = occupied(), out = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (buildable(x, y) && !occ.has(x+","+y)) out.push({ x, y });
  }
  return out;
}

/* ══ 합성 — 같은 종류·같은 등급 셋 ══ */
function mergeGroups() {
  const m = new Map();
  for (const t of S.towers) {
    const k = t.kind + ":" + t.g;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(t);
  }
  return m;
}
function canMerge() {
  for (const [k, arr] of mergeGroups()) {
    const g = +k.split(":")[1];
    if (g < 5 && arr.length >= 3) return k;
  }
  return null;
}
function merge() {
  const k = canMerge();
  if (!k) return;
  const [kind, gs] = k.split(":");
  const g = +gs;
  const arr = mergeGroups().get(k).slice(0, 3);
  // **가장 좋은 자리를 남긴다** — 합쳤더니 구석에 서 있으면 억울하다
  arr.sort((a, b) => coverOf(b) - coverOf(a));
  const keep = arr[0];
  const gone = new Set(arr.slice(1).map(t => t.id));
  S.towers = S.towers.filter(t => !gone.has(t.id));
  keep.g = g + 1;
  keep.maxHp = hpOf(keep); keep.hp = keep.maxHp;     // 합치면 새것처럼 선다
  S.sel = keep.id;
  say(`셋을 합쳐 <b style="color:${GCOL[keep.g]}">${GNAME[keep.g]} ${KINDS[kind].n}</b> 이(가) 되었다.`);
  flyText(cx(keep.x), cy(keep.y), GNAME[keep.g], GCOL[keep.g]);
  refresh();
}
// **본진을 얼마나 감싸는가.** 본진 둘레를 한 바퀴 돌며 사거리에 드는 각도를 센다 —
// 합성 때 어느 자리를 남길지, 그리고 지금 자리가 쓸 만한지의 기준.
function coverOf(t) {
  const r = rngOf(t), tx = cx(t.x), ty = cy(t.y);
  const c = coreCenter(), rad = coreRadius() + CELL * 0.5;
  let n = 0;
  for (let a = 0; a < 24; a++) {
    const th = a / 24 * Math.PI * 2;
    if (Math.hypot(c.x + Math.cos(th) * rad - tx, c.y + Math.sin(th) * rad - ty) <= r) n++;
  }
  return n;
}
const coreCenter = () => ({ x: px(CORE.x) + CELL * CORE.w / 2, y: py(CORE.y) + CELL * CORE.h / 2 });
const coreRadius = () => CELL * CORE.w / 2;

function sell() {
  const t = S.towers.find(x => x.id === S.sel);
  if (!t) return;
  S.gold += sellOf(t);
  S.towers = S.towers.filter(x => x.id !== t.id);
  S.sel = null;
  say(`${GNAME[t.g]} ${KINDS[t.kind].n} 을(를) 팔았다. +${sellOf(t)}`);
  refresh();
}

/* ══ 배치 옮기기 — 빈 슬롯을 누르면 고른 타워가 그리로 간다 ══ */
$("grid").addEventListener("click", (e) => {
  const el = e.target.closest("[data-x]");
  if (!el) return;
  const x = +el.dataset.x, y = +el.dataset.y;
  const here = S.towers.find(t => t.x === x && t.y === y);
  if (here) { S.sel = (S.sel === here.id) ? null : here.id; refresh(); return; }
  const t = S.towers.find(t => t.id === S.sel);
  if (t) { t.x = x; t.y = y; refresh(); }
});

/* ══════════════════════════════════════════════════════════════
   웨이브 — **자동으로 싸운다.** 내가 짜 놓은 것이 나 없이 막는 걸 지켜보는 것이
   이 장르의 심장이다. 그래서 전투 중에는 손댈 것을 일부러 두지 않았다.
   ══════════════════════════════════════════════════════════ */
function startWave() {
  if (S.running || S.over) return;
  S.running = true;
  S.toSpawn = waveN(S.round);
  S.spawned = 0; S.spawnT = 0;
  say(`── <b>${S.round}라운드</b>${isBossR(S.round) ? " · 큰 놈이 온다" : ""}`);
  refresh();
}

/** 이번 웨이브가 어느 방향에서 오는가. **라운드가 오를수록 갈래가 는다** —
 *  한 쪽만 두껍게 막아 두고 넘어가지 못하게 하는 것이 이 구조의 핵심 압박이다. */
function waveLanes(r) {
  const n = Math.min(4, 1 + Math.floor((r - 1) / 3));
  const base = (r * 1.7) % (Math.PI * 2);          // 라운드마다 방향이 돌아간다
  return Array.from({ length: n }, (_, i) => base + i * (Math.PI * 2 / n));
}

function spawnMob() {
  const boss = isBossR(S.round) && S.spawned === 0;
  const hp = waveHp(S.round) * (boss ? 8 : 1);
  const lanes = waveLanes(S.round);
  // 같은 갈래라도 조금씩 흩뿌린다 — 한 줄로 오면 한 타워가 다 잡는다
  const th = lanes[S.spawned % lanes.length] + (Math.random() - 0.5) * 0.5;
  const c = coreCenter();
  const far = Math.hypot(COLS, ROWS) * CELL * 0.52;
  S.mobs.push({
    id: nextId++, hp, maxHp: hp, boss, th,
    x: c.x + Math.cos(th) * far, y: c.y + Math.sin(th) * far,
    speed: (boss ? 15 : 24) * (1 + (S.round - 1) * 0.02),   // px/초
    dmg: Math.round((2 + S.round * 0.6) * (boss ? 4 : 1)),
    slow: 0, slowT: 0, atkT: 0,
  });
  S.spawned++;
}

const mobPos = (m) => ({ x: m.x, y: m.y });
// 본진까지 남은 거리 — 타워는 **제일 가까이 온 놈**부터 노린다
const distToCore = (m) => Math.hypot(m.x - coreCenter().x, m.y - coreCenter().y) - coreRadius();

function hurt(m, d, from) {
  m.hp -= d;
  if (m.hp <= 0) {
    m.dead = true;
    const g = Math.max(1, Math.round(2 + S.round * 0.5)) * (m.boss ? 14 : 1);
    S.gold += g;
    const p = mobPos(m);
    flyText(p.x, p.y, "+" + g, "#e0a458");
  }
}

function flyText(x, y, text, col) {
  const el = document.createElement("div");
  el.className = "fly"; el.textContent = text;
  el.style.cssText = `left:${x}px;top:${y}px;color:${col}`;
  $("field").appendChild(el);
  setTimeout(() => el.remove(), 700);
}

let last = performance.now();
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!S.over) tick(dt);
  paint();
  requestAnimationFrame(step);
}

function tick(dt) {
  // 소환
  if (S.running && S.spawned < S.toSpawn) {
    S.spawnT -= dt;
    if (S.spawnT <= 0) { spawnMob(); S.spawnT = 0.55; }
  }
  // 이동과 교전.
  // **가는 길에 타워가 있으면 그걸 먼저 친다** — 그래서 바깥에 세운 타워가 방벽이 되고,
  // 일찍 요격하는 대신 얻어맞는다. 이 맞바꿈이 "어디에 놓을까"를 진짜 결정으로 만든다.
  const c = coreCenter(), cr = coreRadius();
  for (const m of S.mobs) {
    if (m.slowT > 0) { m.slowT -= dt; if (m.slowT <= 0) m.slow = 0; }
    m.atkT -= dt;

    // 코앞의 타워 (한 칸 반경)
    let block = null, bd = 1e9;
    for (const t of S.towers) {
      const d = Math.hypot(cx(t.x) - m.x, cy(t.y) - m.y);
      if (d < CELL * 0.72 && d < bd) { bd = d; block = t; }
    }
    if (block) {
      if (m.atkT <= 0) {
        m.atkT = 1;
        block.hp -= m.dmg;
        flyText(cx(block.x), cy(block.y), "-" + m.dmg, "#d05353");
        if (block.hp <= 0) {
          say(`<b style="color:${GCOL[block.g]}">${GNAME[block.g]} ${KINDS[block.kind].n}</b> 이(가) 부서졌다.`);
          S.towers = S.towers.filter(t => t.id !== block.id);
          if (S.sel === block.id) S.sel = null;
          refresh();
        }
      }
      continue;                                   // 막힌 동안은 전진하지 않는다
    }

    const d = Math.hypot(m.x - c.x, m.y - c.y);
    if (d <= cr + 8) {                            // 본진에 붙었다
      if (m.atkT <= 0) {
        m.atkT = 1;
        S.coreHp -= m.dmg;
        flyText(c.x, c.y - cr, "-" + m.dmg, "#d05353");
        if (S.coreHp <= 0) { S.coreHp = 0; gameOver(); return; }
      }
      continue;
    }
    const v = m.speed * (1 - m.slow) * dt;
    m.x += (c.x - m.x) / d * v;
    m.y += (c.y - m.y) / d * v;
  }
  S.mobs = S.mobs.filter(m => !m.dead);

  // 타워
  for (const t of S.towers) {
    t.cd = (t.cd || 0) - dt;
    if (t.cd > 0) continue;
    const K = KINDS[t.kind], r = rngOf(t), tx = cx(t.x), ty = cy(t.y);
    // **본진에 제일 가까이 온 놈부터** 노린다 — 먼 놈을 먼저 잡으면 코앞의 것을 놓친다
    let best = null, bestD = 1e9;
    for (const m of S.mobs) {
      if (Math.hypot(m.x - tx, m.y - ty) > r) continue;
      const d = distToCore(m);
      if (d < bestD) { bestD = d; best = m; }
    }
    if (!best) continue;
    t.cd = K.cd;
    const d = dmgOf(t);
    const bp = mobPos(best);
    S.shots.push({ x: tx, y: ty, tx: bp.x, ty: bp.y, life: 0.14, col: K.col });

    hurt(best, d);
    if (K.slow) { best.slow = Math.max(best.slow, K.slow); best.slowT = 1.1; }
    if (K.splash) for (const m of S.mobs) {
      if (m === best || m.dead) continue;
      const p = mobPos(m);
      if (Math.hypot(p.x - bp.x, p.y - bp.y) <= K.splash) hurt(m, Math.round(d * 0.55));
    }
    if (K.chain) {
      let n = K.chain;
      for (const m of S.mobs) {
        if (n <= 0) break;
        if (m === best || m.dead) continue;
        const p = mobPos(m);
        if (Math.hypot(p.x - bp.x, p.y - bp.y) <= 70) {
          hurt(m, Math.round(d * 0.5));
          S.shots.push({ x: bp.x, y: bp.y, tx: p.x, ty: p.y, life: 0.12, col: K.col });
          n--;
        }
      }
    }
  }
  for (const s of S.shots) s.life -= dt;
  S.shots = S.shots.filter(s => s.life > 0);

  // 웨이브 끝
  if (S.running && S.spawned >= S.toSpawn && !S.mobs.length) {
    S.running = false;
    // 웨이브가 끝나면 성한 것은 추스른다. 안 그러면 바깥에 두는 값이 너무 비싸다 —
    // 잃는 것은 **완전히 부서졌을 때뿐**이어야 한다.
    for (const t of S.towers) t.hp = t.maxHp;
    const bonus = 24 + S.round * 9;
    S.gold += bonus;
    say(`${S.round}라운드를 막았다. <b>+${bonus}</b>`);
    S.round++;
    refresh();
  }
}

function gameOver() {
  S.over = true; S.running = false; S.mobs = [];
  const got = relicsFor(S.round);
  META.relics += got;
  META.best = Math.max(META.best, S.round);
  saveMeta();
  $("overT").textContent = "뚫렸다";
  $("overD").innerHTML =
    `${S.round}라운드에서 본진이 무너졌다. 최고 기록 ${META.best}라운드.<br>` +
    `<b style="color:var(--amber)">유물 +${got}</b>`;
  drawShop();
  $("over").classList.add("on");
}

// 유물 상점. **뚫린 화면에서 바로 세지는 게 보여야** "한 판 더"에 손이 간다.
function drawShop() {
  $("shop").innerHTML = Object.entries(UPGRADES).map(([k, u]) => {
    const c = upCost(k), lv = META.up[k];
    return `<button class="up" data-up="${k}" ${META.relics < c ? "disabled" : ""}>
      <span class="n">${u.n}${lv ? ` <span class="dim">${lv}</span>` : ""}</span>
      <span class="d">${u.d}</span><span class="p">유물 ${c}</span></button>`;
  }).join("");
  $("shopHave").textContent = META.relics;
}

/* ══ 그리기 ══ */
function drawTowers() {
  const old = [...document.querySelectorAll("#field .tw, #field .rng")];
  old.forEach(e => e.remove());
  for (const t of S.towers) {
    const K = KINDS[t.kind], sel = S.sel === t.id;
    const el = document.createElement("div");
    el.className = "tw";
    el.style.cssText = `left:${px(t.x)}px;top:${py(t.y)}px;width:${CELL-2}px;height:${CELL-2}px;
      color:${K.col};background:${sel ? "#22201a" : "#181d25"};
      box-shadow:inset 0 0 0 1px ${GCOL[t.g]}${sel ? ",0 0 0 1px var(--amber)" : ""}`;
    const hurt = t.hp < t.maxHp;
    el.innerHTML = `${K.ico}<span class="lvl" style="color:${GCOL[t.g]}">${t.g}</span>` +
      (hurt ? `<span class="thp"><i style="width:${Math.max(0,t.hp/t.maxHp*100)}%;
        background:${t.hp/t.maxHp > .4 ? "#7fb069" : "#d05353"}"></i></span>` : "");
    $("field").appendChild(el);
    if (sel) {
      const r = rngOf(t), rg = document.createElement("div");
      rg.className = "rng";
      rg.style.cssText = `left:${cx(t.x)-r}px;top:${cy(t.y)-r}px;width:${r*2}px;height:${r*2}px`;
      $("field").appendChild(rg);
    }
  }
}

let mobEls = new Map();
let towersHurtLast = false;
function paint() {
  // 몹
  const alive = new Set();
  for (const m of S.mobs) {
    alive.add(m.id);
    let el = mobEls.get(m.id);
    if (!el) {
      el = document.createElement("div");
      el.className = "mob" + (m.boss ? " boss" : "");
      el.innerHTML = "<i></i>";
      $("field").appendChild(el);
      mobEls.set(m.id, el);
    }
    const p = mobPos(m), sz = m.boss ? 26 : 15;
    const pct = Math.max(0, m.hp / m.maxHp);
    el.style.cssText = `left:${p.x - sz/2}px;top:${p.y - sz/2}px;width:${sz}px;height:${sz}px;` +
      `background:${m.slow ? "#5b7f9e" : m.boss ? "#8c3a3a" : "#7a4a4a"}`;
    el.firstChild.style.width = (sz * pct) + "px";
    el.firstChild.style.background = pct > .5 ? "var(--good)" : "var(--bad)";
  }
  for (const [id, el] of mobEls) if (!alive.has(id)) { el.remove(); mobEls.delete(id); }

  // 타워 체력바는 매 프레임 바뀐다 — 구성이 그대로여도 여기서 다시 쓴다
  if (S.towers.some(t => t.hp < t.maxHp) || towersHurtLast) {
    towersHurtLast = S.towers.some(t => t.hp < t.maxHp);
    drawTowers();
  }

  // 탄
  document.querySelectorAll("#field .shot").forEach(e => e.remove());
  for (const s of S.shots) {
    const f = 1 - s.life / 0.14;
    const el = document.createElement("div");
    el.className = "shot";
    el.style.cssText = `left:${s.x + (s.tx - s.x) * f}px;top:${s.y + (s.ty - s.y) * f}px;background:${s.col}`;
    $("field").appendChild(el);
  }

  $("hGold").textContent = Math.floor(S.gold);
  $("hLife").textContent = Math.max(0, Math.ceil(S.coreHp)) + "/" + S.coreMax;
  const cb = $("coreBar"), cn = $("coreNum");
  if (cb) cb.style.width = Math.max(0, S.coreHp / S.coreMax * 100) + "%";
  if (cn) cn.textContent = Math.max(0, Math.ceil(S.coreHp));
  $("hRound").textContent = S.round;
  $("hRelic").textContent = META.relics;
  $("rollBtn").disabled = S.gold < rollCost() || S.over;
}

/* ══ 패널 ══ */
function refresh() {
  drawTowers();
  $("rollCost").textContent = rollCost();
  $("rollNote").textContent = `뽑을수록 값이 오른다. 지금 ${S.towers.length}기.`;
  $("waveBtn").textContent = S.running ? "막는 중…" : `${S.round}라운드 시작`;
  $("waveBtn").disabled = S.running || S.over;
  const lanes = waveLanes(S.round).length;
  $("waveNote").textContent = S.running
    ? `${S.spawned}/${S.toSpawn} 나옴 · 남은 놈 ${S.mobs.length}`
    : `적 ${waveN(S.round)}마리 · 체력 ${waveHp(S.round)} · ${lanes}갈래에서 온다` +
      (isBossR(S.round) ? " · 큰 놈이 섞인다" : "");

  const m = mergeGroups();
  const rows = [];
  for (const kind of KIND_IDS) for (const g of GRADE) {
    const arr = m.get(kind + ":" + g);
    if (!arr) continue;
    const ready = g < 5 && arr.length >= 3;
    rows.push(`<li class="${ready ? "ready" : ""}">
      <span style="color:${GCOL[g]}">${GNAME[g]} ${KINDS[kind].n}</span>
      <span>${arr.length}기${ready ? " · 합칠 수 있다" : ""}</span></li>`);
  }
  $("tally").innerHTML = rows.join("") || `<li><span class="note">아직 없다</span></li>`;
  $("mergeBtn").disabled = !canMerge() || S.over;

  const t = S.towers.find(x => x.id === S.sel);
  $("sellBtn").disabled = !t || S.over;
  $("selInfo").innerHTML = t ? `<div class="sel-info">
      <div class="nm" style="color:${GCOL[t.g]}">${GNAME[t.g]} ${KINDS[t.kind].n}</div>
      <div class="st">피해 ${dmgOf(t)} · 사거리 ${rngOf(t)} · ${KINDS[t.kind].d}<br>
        본진 둘레를 ${Math.round(coverOf(t)/24*100)}% 덮는다 · 체력 ${t.hp}/${t.maxHp} · 팔면 ${sellOf(t)}<br>
        <span style="color:var(--steel)">빈 칸을 누르면 그리로 옮긴다.</span></div></div>`
    : `<div class="note">타워를 누르면 사거리가 보이고, 빈 칸을 누르면 그리로 옮긴다.</div>`;
}

$("rollBtn").onclick = roll;
$("mergeBtn").onclick = merge;
$("sellBtn").onclick = sell;
$("waveBtn").onclick = startWave;
$("again").onclick = newGame;
addEventListener("resize", layout);
addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); if (!S.running) startWave(); }
  if (e.key === "r" || e.key === "R") roll();
  if (e.key === "m" || e.key === "M") merge();
});

// 검증 도구용 창구
Object.assign(window, { S, KINDS, GNAME, roll, merge, sell, startWave, refresh, tick, canMerge,
  freeSlots, waveHp, waveN, waveLanes, coreCenter, coreRadius, distToCore, hpOf, coverOf,
  cx, cy, rngOf, dmgOf, buildable, CORE });

function newGame() {
  Object.assign(S, {
    gold: metaGold(), coreHp: metaLife(), coreMax: metaLife(), round: 1, rolls: 0,
    towers: [], mobs: [], shots: [],
    running: false, spawned: 0, toSpawn: 0, spawnT: 0, sel: null, over: false,
  });
  mobEls.forEach(el => el.remove()); mobEls.clear();
  // 선발대 — 빈손으로 시작하지 않는다는 감각이 영구 성장의 첫 체감이다
  for (let i = 0; i < META.up.start; i++) {
    const free = freeSlots();
    if (!free.length) break;
    const slot = free[Math.floor(Math.random() * free.length)];
    const t0 = { id: nextId++, kind: KIND_IDS[Math.floor(Math.random()*KIND_IDS.length)],
                 g: 2, x: slot.x, y: slot.y };
    t0.hp = t0.maxHp = hpOf(t0);
    S.towers.push(t0);
  }
  $("over").classList.remove("on");
  $("log").innerHTML = "";
  refresh();
  say("골드로 <b>뽑고</b>, 같은 것 셋을 <b>합치고</b>, 라운드를 시작해 막는다.");
  say("전투는 알아서 돈다 — 짜 놓은 것이 얼마나 버티는지 보면 된다.");
  if (META.relics || META.best) say(`유물 <b>${META.relics}</b> · 최고 <b>${META.best}</b>라운드`);
}
$("shop").addEventListener("click", (e) => {
  const b = e.target.closest("[data-up]");
  if (!b || b.disabled) return;
  const k = b.dataset.up, c = upCost(k);
  if (META.relics < c) return;
  META.relics -= c; META.up[k]++;
  saveMeta(); drawShop(); paint();
});
Object.assign(window, { META, newGame, drawShop, relicsFor, upCost, UPGRADES, saveMeta, metaDmg });

layout(); newGame(); requestAnimationFrame(step);
</script>
</body>
</html>
