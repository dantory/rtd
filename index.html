<!DOCTYPE html>
<!--
  벙커 디펜스 — 유즈맵 감성 방치형 프로토타입.

  취향에서 출발했다: 병수님은 스타/워크 **유즈맵**을 재밌어했고, 재미의 축 넷 중에서는
  **①숫자가 불어나는 것**에 손이 제일 오래 갔다. 그 교집합이 이것이다.

  루프는 유즈맵 랜타디 그대로다:
      편성한다 → 출격해 관전한다 → 유물을 번다 → 징집·합성·훈련·증축 → 다시 편성한다

  네 가지가 각각 다른 재미를 맡는다. 하나라도 빠지면 나머지가 심심해진다.
    뽑기   무엇이 나올까 (도파민, 매번 다르다)
    합성   같은 것 셋 → 한 등급 위. **숫자가 커지는 맛**이 여기 있다
    배치   길에서 먼 자리는 사거리가 닿지 않는다 — 공짜가 아니다
    관전   내가 짜 놓은 것이 나 없이 막는 걸 지켜본다

  판정할 질문: **다음 라운드를 누르고 싶은가.**
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 이게 없으면 폰이 데스크탑 폭(980px)으로 그린 뒤 축소한다 — 글자가 개미만 해진다.
     user-scalable=no: 칸을 두드리다 두 번 눌리면 확대되어 판이 튄다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>벙커 디펜스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="title">벙커 디펜스</span>
  <span class="sub">모으고 · 합치고 · 내보낸다</span>
  <div class="hud">
    <span>라운드 <b id="hRound">1</b></span>
    <!-- 눌러서 언제든 상점을 연다 — 벽에 부딪힌 그 자리에서 강해질 수 있어야 한다 -->
    <button class="rlc" id="relicBtn" title="유물 상점">유물 <b id="hRelic">0</b></button>
    <button id="setBtn" title="설정" style="padding:4px 11px;margin-left:-6px">≡</button>
  </div>
</header>

<main>
  <div id="field">
    <div id="world"><div id="grid"></div></div>
    <div class="viewbtns">
      <button id="runBtn" title="뽑기·합성까지 알아서 한다">⚙</button>
      <button id="autoBtn" title="웨이브가 알아서 이어진다">∞</button>
      <button id="spdBtn" title="배속">1×</button>
      <button id="fitBtn" title="전체 보기">⤢</button>
      <button id="zinBtn" title="확대">＋</button>
      <button id="zoutBtn" title="축소">－</button>
    </div>
    <!-- **편성은 따로 본다.** 전장에서 대원이 쏘는 걸 보는 건 그대로 두되(그게 이 장르의
         재미다), 누구를 넣고 뺄지는 칩 대신 제대로 된 화면에서 고른다 — 창고가 열 기를
         넘어가면 44px 칩으로는 무엇이 있는지조차 안 읽힌다. -->
    <div id="squad"><div class="box">
      <h2>벙커 편성</h2>
      <div class="note" id="sqNote"></div>
      <div class="sqslots" id="sqSlots"></div>
      <h3 class="sqh">창고 <span class="dim" id="sqBoxN"></span></h3>
      <div class="sqbox" id="sqBox"></div>
      <!-- 합치고 해산하는 것도 부대를 다루는 일이다. 전장이 아니라 여기에 둔다. -->
      <div class="rowbtn" style="gap:7px;margin-top:12px">
        <button id="sqMerge" style="flex:1">셋을 합친다</button>
        <button id="sqSell">고른 것 해산</button>
      </div>
      <div class="note" id="sqTip"></div>
      <div class="stick"><button id="sqClose" style="padding:11px 26px">닫는다</button></div>
    </div></div>
    <!-- 설정 — 게임 진행과 상관없는 손잡이들이 모이는 곳. 지금은 초기화 하나다. -->
    <div id="settings"><div class="box">
      <h2>설정</h2>
      <div class="rowbtn" style="margin-top:14px">
        <button id="wipeBtn" style="flex:1;padding:10px 14px;color:#d08a8a;border-color:#4a2e2e">초기화 — 저장을 지우고 처음부터</button>
      </div>
      <div class="note" style="margin-top:8px">부대 · 유물 · 업그레이드 · 도감 · 최고 기록이 전부 지워진다.</div>
      <div class="stick"><button id="setClose" style="padding:11px 26px">닫는다</button></div>
    </div></div>
    <div id="over"><div class="box">
      <h2 id="overT"></h2>
      <div class="note" id="overD" style="font-size:13px"></div>
      <div class="shopwrap">
        <h3>부대 <span class="dim">가진 유물 <b id="shopHave2">0</b></span></h3>
        <div class="rowbtn" style="gap:7px">
          <button id="recruitBtn" style="flex:1">징집 <span class="c" id="recCost"></span></button>
          <button id="toSquad" style="flex:1">편성</button>
        </div>
        <div class="note" id="armyNote"></div>
      </div>
      <div class="shopwrap">
        <h3>능력치 <span class="dim">판을 넘어 남는다 · 가진 유물 <b id="shopHave">0</b></span></h3>
        <div class="shop" id="shop"></div>
      </div>
      <div class="shopwrap">
        <h3>병과 훈련 <span class="dim">도감 <b id="dexHave">0</b>/<b id="dexAll">0</b> · 눌러서 그 병과를 키운다</span></h3>
        <div class="dex" id="dex"></div>
      </div>
      <!-- 상점+도감은 폰 화면보다 340~370px 길다. 버튼이 그 아래에 있으면 스크롤을
           내려야 나오는데, 스크롤이 되는 줄 모르면 그건 그냥 잘린 화면이다. 바닥에 붙인다. -->
      <div class="stick"><button id="again" style="padding:11px 26px">한 판 더</button></div>
    </div></div>
  </div>

  <aside>
    <section>
      <!-- 판 안에서는 뽑지도 합치지도 않는다. 짜 놓은 것이 굴러가는 걸 볼 뿐이다. -->
      <div class="toprow">
        <button class="wide roll" id="waveBtn2"></button>
      </div>
      <div class="note" id="rollNote"></div>
      <div class="note helpnote" style="margin-top:10px;color:#5f6874">
        가운데 <b style="color:var(--steel)">벙커</b>를 지킨다. 적은 <b>사방에서</b> 곧장 밀려온다.<br>
        대원은 벙커 안에 있어 <b>맞지 않는다</b> — 깎이는 것은 벙커뿐이다.<br>
        판이 끝나면 유물로 <b>징집·훈련·증축</b>을 한다.
      </div>
    </section>

    <section class="wavesec">
      <h3>다음 웨이브</h3>
      <button class="wide" id="waveBtn"></button>
      <div class="note" id="waveNote"></div>
    </section>

    <section>
      <h3>부대 <span class="dim" id="holdHint"></span>
        <button id="squadBtn" class="sqopen">편성</button></h3>
      <div class="tally" id="tally"></div>

      
      <div id="selInfo"></div>
    </section>

    <section>
      <!-- 테스트용 — 저장(부대·유물·업그레이드·도감·최고 기록)을 지우고 처음부터.
           기록 **위**에 둔다: 로그가 30줄까지 자라서, 아래에 두면 플레이 중엔
           스크롤 밖으로 밀려나 있는지도 모르게 된다. 실수로 못 누르게 확인을 한 번 묻는다. -->
      <h3>기록</h3>
      <div id="log"></div>
    </section>
  </aside>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
