<!DOCTYPE html>
<!--
  랜덤 타워디펜스 — 유즈맵 감성 프로토타입.

  취향에서 출발했다: 병수님은 스타/워크 **유즈맵**을 재밌어했고, 재미의 축 넷 중에서는
  **①숫자가 불어나는 것**에 손이 제일 오래 갔다. 그 교집합이 이것이다.

  루프는 유즈맵 랜타디 그대로다:
      뽑는다 → 합친다 → 배치한다 → 웨이브가 자동으로 온다 → 골드 → 또 뽑는다

  네 가지가 각각 다른 재미를 맡는다. 하나라도 빠지면 나머지가 심심해진다.
    뽑기   무엇이 나올까 (도파민, 매번 다르다)
    합성   같은 것 셋 → 한 등급 위. **숫자가 커지는 맛**이 여기 있다
    배치   길에서 먼 자리는 사거리가 닿지 않는다 — 공짜가 아니다
    관전   내가 짜 놓은 것이 나 없이 막는 걸 지켜본다

  판정할 질문: **다음 라운드를 누르고 싶은가.**
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 이게 없으면 폰이 데스크탑 폭(980px)으로 그린 뒤 축소한다 — 글자가 개미만 해진다.
     user-scalable=no: 칸을 두드리다 두 번 눌리면 확대되어 판이 튄다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>랜덤 타워디펜스</title>
<style>
  :root{--bg:#0b0d10;--panel:#12151a;--line:#232830;--fg:#c6ccd4;--dim:#6b7480;
    --amber:#e0a458;--good:#7fb069;--bad:#d05353;--steel:#6ba8d6;--magic:#a978c9}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"D2Coding","Menlo","Noto Sans Mono CJK KR",monospace;font-size:14px;
    display:flex;flex-direction:column;user-select:none;
    /* 폰에서 길게 눌러 메뉴가 뜨거나 당겨서 새로고침되면 판이 그대로 끊긴다 */
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  header{display:flex;align-items:baseline;gap:14px;padding:9px 16px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .title{color:var(--amber);letter-spacing:3px;font-weight:bold}
  .sub{color:var(--dim);font-size:12px}
  .hud{margin-left:auto;display:flex;gap:18px;font-size:13px}
  .hud b{color:var(--amber);font-weight:normal}
  .hud .life b{color:var(--bad)}
  main{flex:1;display:flex;min-height:0}

  /* ── 전장 ── */
  /* **touch-action: none 이 없으면 브라우저가 한 손가락 끌기를 스크롤로 가로챈다.**
     preventDefault 를 불러도 이미 늦다 — 첫 움직임을 두드림인지 보려고 흘려보내는 사이
     브라우저가 제스처를 가져가 버리고, 그 뒤로는 touchmove 가 아예 안 온다.
     (핀치만 되고 이동이 안 되던 이유가 이것이었다 — 두 손가락은 첫 move 에서 바로 막았다.) */
  #field{position:relative;flex:1;min-width:0;background:#0e1116;overflow:hidden;
    touch-action:none}
  .viewbtns button{touch-action:manipulation}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  /* 벌판 타일은 서로 물리도록 칸보다 크게 그리고 가장자리가 흐리다 — 그 아래로 비칠
     바탕을 깔아 둔다. 안 깔면 흐린 자락에서 검은 판이 비쳐 이음새가 도로 살아난다. */
  #grid{position:absolute;inset:0;background:#171614}
  /* 손가락이 없어도, 있어도 쓸 수 있게 버튼도 둔다 — 핀치를 모르는 사람이 판을 못 보면 안 된다 */
  .viewbtns{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:30}
  .viewbtns button.on{border-color:var(--amber);color:var(--amber);background:rgba(40,32,18,.9)}
  .viewbtns button{width:38px;height:38px;padding:0;font-size:15px;line-height:1;
    background:rgba(20,26,34,.86);border:1px solid #38465a;border-radius:6px;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .tile{position:absolute;border-radius:2px}
  /* **길은 한 줄기로 이어져 보여야 한다.** 칸마다 틈이 있으면 몹이 어디로 가는지 안 읽히고,
     그러면 어디에 놓을지가 감이 아니라 운이 된다(첫 판에서 실제로 그랬다).
     그래서 길 타일만 틈 없이 붙이고 한 단계 밝게 깐다. */
  .tile.road{background:#2b3543;border-radius:0}
  /* **놓을 수 있는 자리는 한눈에 갈려야 한다.** 바깥 땅과 색이 비슷하면 어디까지가 내
     터인지 몰라 배치가 감이 된다. 터는 밝게 깔고, 적이 달려오는 바깥은 거의 배경으로 둔다. */
  .tile{background-size:cover;background-position:center;image-rendering:pixelated}
  /* **터는 따로 깐 판이 아니라 같은 땅에 그은 구획이다.**
     전에는 pad.png 를 어두운 막과 함께 칸보다 작게 깔았다. 찍어 놓고 보니 검은 바탕 위에
     회색 판때기가 줄지어 떠 있는 꼴이었고 — 벌판과 완전히 끊겨 그게 제일 허접했다.
     이제 땅은 벌판과 **같은 것**을 이어 깔고, 그 위에 옅은 빛과 가는 선만 얹어
     "여기 놓을 수 있다"는 것만 말한다. 땅은 하나로 이어지고 정보는 그대로 남는다. */
  /* 타일셋이 터를 철판 데크로 그려 주므로 여기서 밝힐 것은 없다. 남길 것은 **칸 금**뿐이다 —
     밝은 바닥 위에서는 밝은 선이 안 보인다(찍어 보니 통짜 철판 한 장으로 읽혔다). 어두운 선으로
     긋는다. 놓는 게임에서 칸이 안 세어지면 배치가 눈대중이 된다. */
  /* **열린 자리는 세어져야 한다.** 셋뿐인데 어디가 열렸는지 안 보이면 자리가 제약이라는 걸
     알 수가 없다. 열린 칸은 테두리를 확실히 긋고 안쪽을 살짝 띄우고, 잠긴 칸은 덮되
     **바닥이 비칠 만큼만** 덮는다 — 새까맣게 덮으면 앞마당이 통째로 구멍으로 보인다. */
  .slot{position:absolute;cursor:pointer;
    background:linear-gradient(rgba(150,192,238,.11),rgba(150,192,238,.03));
    box-shadow:inset 0 0 0 1px rgba(190,214,240,.55)}
  .slot.locked{cursor:default;background:rgba(6,9,13,.40);
    box-shadow:inset 0 0 0 1px rgba(120,140,166,.13)}
  .slot:not(.locked):hover{box-shadow:inset 0 0 0 1px var(--amber)}
  .slot.sel{box-shadow:inset 0 0 0 2px var(--amber);background:rgba(214,168,74,.14)}
  /* **가장자리가 맞물리는 타일이라 딱 맞게 깔아야 한다.** 낱장 흙 타일은 서로 겹쳐 깔아
     이음새를 뭉갰지만(그래도 칸 경계가 읽혔다), Wang 타일은 이웃과 맞물리도록 구워져
     있어서 겹치거나 돌리면 그 맞물림이 깨진다. 한 장 시트에서 잘라 1:1 로 깐다. */
  .tile.wang{border:0;border-radius:0;background-repeat:no-repeat;
    background-image:url("assets/ui/tileset.png");background-size:256px 256px}
  /* 잔해 — 벌판에 얹는 배경 소품. 눈에 띄면 적으로 오인되므로 확실히 가라앉힌다. */
  .deco{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
    object-fit:contain;image-rendering:pixelated;opacity:.9;
    filter:brightness(.78) saturate(.8) drop-shadow(0 2px 3px rgba(0,0,0,.55))}
  /* 판의 끝을 어둠에 담근다 — 딱 잘린 네모로 끝나면 "작은 판"이라는 게 그대로 드러난다.
     가운데(싸우는 곳)는 건드리지 않는다. */
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,
      rgba(14,17,22,0) 30%, rgba(14,17,22,.3) 55%,
      rgba(14,17,22,.75) 78%, rgba(14,17,22,1) 97%)}
  .mark{position:absolute;font-size:11px;color:var(--dim);pointer-events:none;letter-spacing:1px}
  /* 본진 — 칸을 쪼개지 않고 한 덩이로. 조각으로 두면 지킬 것이 아니라 타일로 읽힌다. */
  .core{position:absolute;background:#151c25;border:1px solid #3d5468;border-radius:3px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    pointer-events:none;box-shadow:0 0 0 1px rgba(107,168,214,.18) inset}
  /* 한 칸짜리다. 그림이 칸을 꽉 채우고, 체력은 **칸 밖 위쪽**에 얹는다 —
     안에 넣으면 64px 안에서 그림과 겹쳐 둘 다 안 읽힌다. 이름은 뺐다(가운데 것이 본진이다). */
  .core .cspr{position:absolute;left:-6%;top:-12%;width:112%;height:112%;object-fit:contain;
    image-rendering:pixelated;filter:drop-shadow(0 3px 5px rgba(0,0,0,.75))}
  .core .cbar{position:absolute;left:-10%;width:120%;top:-15px;height:5px;
    background:#141a22;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
  .core .cbar i{display:block;height:100%;background:linear-gradient(90deg,#4a6b3f,#7fb069);transition:width .15s}
    /* 수치는 헤더에 이미 있다("본진 520/520"). 한 칸 위에 또 적으면 그림만 가린다. */
  .core .cnum{display:none}
  /* 타워도 맞는다 — 얼마나 성한지가 보여야 "저건 빼자"가 결정이 된다 */
  .tw .thp{position:absolute;left:4px;right:4px;bottom:2px;height:2px;background:#2a3038;border-radius:1px}
  .tw .thp i{display:block;height:100%;background:#7fb069;border-radius:1px}

  /* ── 유닛 ──
     **그림이 있으면 그림, 없으면 글자.** 에셋이 아직 안 구워졌다고 게임이 안 돌면 안 되고,
     반대로 그림이 붙으면 글자는 사라져야 한다(둘 다 보이면 지저분하다). */
  .tw{position:absolute;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;border-radius:3px;pointer-events:none;line-height:1;overflow:visible}
  .tw .spr{position:absolute;inset:6% 6% 14%;width:88%;height:80%;object-fit:contain;
    image-rendering:pixelated;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
  .tw .ico{display:none;font-size:17px;margin-bottom:auto;margin-top:22%}
  .tw.noimg .ico{display:block}
  .tw .lvl{position:relative;font-size:8px;letter-spacing:-1px;margin-bottom:3px;
    text-shadow:0 1px 2px #000}
  /* 방금 뽑히거나 합쳐진 것 — 목록의 숫자만 바뀌면 무슨 일이 있었는지 안 남는다 */
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes flare{0%{box-shadow:0 0 0 0 rgba(224,164,88,.9)}100%{box-shadow:0 0 0 16px rgba(224,164,88,0)}}
  .tw.rolled{animation:pop .28s ease-out}
  .tw.merged{animation:pop .32s ease-out, flare .55s ease-out}

  .mob{position:absolute;pointer-events:none;transition:none;border-radius:50%}
  .mob .spr{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    image-rendering:pixelated;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .mob.noimg{background:#7a4a4a;border-radius:50%}
  .mob .spr{filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))
    grayscale(1) sepia(1) saturate(5.5) hue-rotate(-32deg) brightness(.95)}
  /* 서리를 맞으면 파랗게 식는다 — 로그를 안 봐도 느려진 게 보인다 */
  .mob.slowed .spr{filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))
    grayscale(1) sepia(1) saturate(4) hue-rotate(160deg) brightness(1.15)}
  .mob i{position:absolute;left:50%;transform:translateX(-50%);top:-7px;height:3px;
    border-radius:2px;z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
  .mob.boss{filter:drop-shadow(0 0 4px rgba(208,83,83,.8))}
  .boom{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%);
    image-rendering:pixelated;pointer-events:none;animation:pop .3s ease-out}

  /* 다음 웨이브가 오는 갈래 — 안 보여 주면 첫 라운드가 무조건 헛방이 된다 */
  .lane{position:absolute;color:#8c3a3a;font-size:19px;pointer-events:none;
    text-shadow:0 0 6px rgba(140,58,58,.7);animation:lanep 1.6s ease-in-out infinite}
  @keyframes lanep{0%,100%{opacity:.45}50%{opacity:1}}
  .shot{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none}
  .rng{position:absolute;border-radius:50%;border:1px dashed #3f4a58;pointer-events:none}
  .fly{position:absolute;font-size:11px;color:var(--amber);pointer-events:none;
    animation:fly .7s ease-out forwards}
  @keyframes fly{to{transform:translateY(-22px);opacity:0}}

  /* ── 옆 패널 ── */
  aside{width:290px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);
    padding:12px 14px;overflow-y:auto}
  aside h3{margin:0 0 7px;font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:normal}
  aside section{margin-bottom:15px}
  button{font-family:inherit;font-size:13px;cursor:pointer;color:var(--fg);
    background:#1a2029;border:1px solid #333c48;border-radius:4px;padding:8px 12px}
  button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
  button:disabled{opacity:.32;cursor:default}
  .wide{width:100%}
  .roll{padding:13px;font-size:15px}
  .roll .c{color:var(--good)}
  .rowbtn{display:flex;gap:8px;margin-top:8px}
  #waveBtn2{display:none}
  .note{color:var(--dim);font-size:11px;line-height:1.6;margin-top:7px}
  .sel-info{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:9px}
  .sel-info .nm{color:var(--amber)}
  .sel-info .st{color:var(--dim);font-size:12px;line-height:1.6;margin-top:4px}
  .poolrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px;font-size:11px}
  .pchip{position:relative;width:26px;height:26px;border-radius:3px;background:#161c24;
    border:1px solid #262f3a;overflow:hidden;flex-shrink:0}
  .pchip img{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);
    object-fit:contain;image-rendering:pixelated}
  .pchip i{display:none;font-style:normal;font-size:13px;line-height:26px}
  .pchip.noimg i{display:block}

  .tally{display:flex;flex-wrap:wrap;gap:6px}
  .sqopen{float:right;padding:2px 10px;font-size:11px;letter-spacing:1px;
    background:#1a2029;border:1px solid #3a4658;border-radius:4px;color:var(--steel)}
  .sqopen:hover{border-color:var(--amber);color:var(--amber)}
  .hold{position:relative;width:44px;height:44px;padding:0;border-radius:4px;
    background:#161c24;border:1px solid #262f3a;overflow:hidden}
  .hold .spr{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);
    object-fit:contain;image-rendering:pixelated}
  .hold .ico{display:none;font-size:17px;line-height:44px}
  .hold.noimg .ico{display:block}
  .hold .cnt{position:absolute;right:2px;bottom:1px;font-size:10px;color:var(--fg);
    text-shadow:0 1px 2px #000}
  .hold .gr{position:absolute;left:0;right:0;top:0;height:2px}
  /* 셋이 모인 것 — 여기가 눌러야 할 자리다 */
  .hold.ready{border-color:var(--good);cursor:pointer}
  .hold.ready::after{content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 10px rgba(127,176,105,.45);animation:lanep 1.4s ease-in-out infinite}
  /* 도감 — 진열대 칩보다 크게. 모은 것을 들여다보는 자리라 얼굴이 보여야 한다. */
  .dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
  .dxc{position:relative;padding:5px 3px 4px;border-radius:5px;background:#161c24;
    border:1px solid #262f3a;display:flex;flex-direction:column;align-items:center;gap:2px}
  .dxc .spr{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
  .dxc .ico{font-size:15px;line-height:1}
  .dxc:not(.noimg) .ico{display:none}
  .dxc .dxn{font-size:10px;color:var(--dim);letter-spacing:0}
  .dxc .dxg{font-size:9px;letter-spacing:-1px}
  .dxc .dxt{font-size:9px;color:#5f6874;letter-spacing:0}
  .dxc.train{cursor:default;font-family:inherit}
  .dxc.train.can{cursor:pointer;border-color:#4a3d22}
  .dxc.train.can .dxt b{color:var(--amber)}
  .dxc.train.can:hover{border-color:var(--amber)}
  .dxc.off{opacity:.34}
  .dxc.off .ico{font-size:22px;color:#4a5361;display:block}
  .hold:not(.ready){opacity:.94}
  .hold.away{opacity:.46}                /* 한 기도 안 나가 있는 것 — 창고에서 대기 중이다 */
  #log{font-size:11px;color:var(--dim);line-height:1.65;max-height:150px;overflow-y:auto}
  #log b{color:var(--amber);font-weight:normal}
  /* ══════════════════════════════════════════════════════════
     폰 — **세로 화면에서는 옆 패널이 아니라 아래 패널이다.**
     290px 짜리 옆 패널을 그대로 두면 폰 폭의 3/4 를 먹어 전장이 사라진다.
     전장을 위에 크게 두고, 조작은 엄지가 닿는 아래로 내린다.
     ══════════════════════════════════════════════════════════ */
  @media (max-width: 820px), (orientation: portrait) and (max-width: 1000px) {
    body{font-size:13px}
    header{padding:7px 11px;gap:8px}
    .title{font-size:13px;letter-spacing:2px}
    .sub{display:none}                     /* 좁은 폭에서 부제는 자리만 먹는다 */
    .hud{gap:10px;font-size:12px;flex-wrap:wrap;justify-content:flex-end}

    /* **전장이 화면의 절반뿐이면 판이 작아 보인다.** 아래 패널이 54vh 를 먹고 있었고
       그 절반은 상시 설명문이었다 — 설명은 접고(helpnote) 기록은 줄여 전장에 넘긴다. */
    main{flex-direction:column}
    #field{flex:1 1 auto;min-height:52vh}
    aside{width:100%;max-height:41vh;border-left:none;border-top:1px solid var(--line);
      padding:10px 12px calc(10px + env(safe-area-inset-bottom))}

    /* 조작은 한 줄에 나란히 — 세로로 쌓으면 스크롤해야 뽑기 버튼이 나온다 */
    .toprow{display:flex;gap:8px;align-items:stretch}
    .toprow>*{flex:1}
    #waveBtn2{display:block}
    .roll{padding:14px 10px;font-size:15px}
    aside section{margin-bottom:11px}
    /* 손가락이 닿는 크기로 — 44px 아래로 내려가면 옆 칸이 눌린다 */
    .hold{width:48px;height:48px}
    .pchip{width:30px;height:30px}
    button{padding:11px 12px}
    .helpnote{display:none}                /* 규칙 설명은 폰에서 접는다 */
    /* 웨이브 버튼이 위(엄지 자리)에 있으니 아래 것은 중복이다 — 같은 일을 하는 버튼이
       둘이면 둘 다 안 읽힌다. 안내 문구만 남긴다. */
    .wavesec h3, .wavesec #waveBtn{display:none}
    .wavesec{margin-top:-4px}
    #log{max-height:54px}
    #over .box{padding:18px 16px;max-width:94vw;max-height:88vh;overflow-y:auto}
  }
  /* 유물은 **누를 수 있는 것**이라는 게 보여야 한다 — 상점으로 가는 유일한 문이다. */
  .rlc{padding:2px 8px;font-size:inherit;font-family:inherit;color:var(--fg);
    background:rgba(40,32,18,.5);border:1px solid #4a3d22;border-radius:4px;cursor:pointer}
  .rlc:hover{border-color:var(--amber)}
  /* 살 것이 있을 때만 뛴다. 늘 뛰면 그건 배경이 되고 아무도 안 본다. */
  .rlc.hot{border-color:var(--amber);color:var(--amber);animation:relicPulse 1.6s ease-in-out infinite}
  @keyframes relicPulse{0%,100%{box-shadow:0 0 0 0 rgba(214,168,74,0)}
    50%{box-shadow:0 0 0 3px rgba(214,168,74,.28)}}
  @media (max-width: 420px){ aside{max-height:38vh} }

  /* 편성 화면 — 상점과 같은 틀을 쓴다. 뒤에서 게임은 계속 돈다(방치형이니 멈출 이유가 없다). */
  #squad{position:fixed;inset:0;background:rgba(6,8,10,.93);display:none;z-index:390;
    align-items:center;justify-content:center;text-align:center;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #squad.on{display:flex}
  #squad .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:22px 20px;box-shadow:0 18px 60px rgba(0,0,0,.6);max-width:94vw;max-height:88vh;overflow-y:auto}
  #squad h2{color:var(--amber);font-weight:normal;letter-spacing:2px;margin:0 0 6px}
  #squad .sqh{margin:16px 0 7px;font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:normal}
  /* 자리는 **가로로 늘어놓는다.** 벙커에 끼운 것을 한눈에 세는 게 이 화면의 전부다. */
  .sqslots{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:7px}
  .sqs{position:relative;aspect-ratio:1;border-radius:6px;background:#161c24;
    border:1px solid #3a4658;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;padding:0;font-family:inherit}
  .sqs.empty{border-style:dashed;border-color:#2b3441;cursor:default}
  .sqs:not(.empty):hover{border-color:var(--amber)}
  .sqs .spr{width:74%;height:74%;object-fit:contain;image-rendering:pixelated}
  .sqs .ico{font-size:19px}
  .sqs:not(.noimg) .ico{display:none}
  .sqs .gr{position:absolute;bottom:3px;font-size:8px;letter-spacing:-1px}
  .sqs .no{font-size:20px;color:#39424f}
  .sqbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:7px}
  .sqb{position:relative;aspect-ratio:1;border-radius:6px;background:#161c24;border:1px solid #262f3a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    padding:0;font-family:inherit}
  .sqb:hover{border-color:var(--amber)}
  .sqb .spr{width:70%;height:70%;object-fit:contain;image-rendering:pixelated}
  .sqb .ico{font-size:17px}
  .sqb:not(.noimg) .ico{display:none}
  .sqb .cnt{position:absolute;right:3px;bottom:2px;font-size:10px;color:var(--fg)}
  .sqb .gr{position:absolute;left:0;right:0;top:0;height:2px;border-radius:2px 2px 0 0}
  #over{position:fixed;inset:0;background:rgba(6,8,10,.93);display:none;z-index:400;
    align-items:center;justify-content:center;text-align:center;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #over.on{display:flex}
  #over .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:26px 30px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
  #over h2{color:var(--amber);font-weight:normal;letter-spacing:2px;margin:0 0 8px}
  #over>div{max-width:520px}
  .shopwrap h3{font-size:12px;letter-spacing:1px;color:var(--dim);font-weight:normal;margin:18px 0 8px}
  .shopwrap h3 b{color:var(--amber);font-weight:normal}
  /* 폭에 맞춰 저절로 접히게 한다. 열 수를 미디어쿼리로 박아 두었더니 그 규칙이 아래에 있어
     폰에서도 2열이 이겨 카드 절반이 화면 밖으로 잘려 나갔다. */
  .shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:7px;text-align:left}
  .up{display:flex;align-items:center;gap:11px;padding:9px 12px}
  .up{flex-direction:column;align-items:flex-start;gap:3px;min-width:190px}
  .up .n{color:var(--amber);width:auto}
  .up .d{color:var(--dim);font-size:11px;line-height:1.4}
  .up .p{color:var(--good);font-size:11px}
  .up:disabled .p{color:var(--dim)}
</style>
</head>
<body>
<header>
  <span class="title">랜덤 타워디펜스</span>
  <span class="sub">뽑고 · 합치고 · 막는다</span>
  <div class="hud">
    <span>라운드 <b id="hRound">1</b></span>
    <span>골드 <b id="hGold">0</b></span>
    <span class="life">본진 <b id="hLife">—</b></span>
    <!-- 눌러서 언제든 상점을 연다 — 벽에 부딪힌 그 자리에서 강해질 수 있어야 한다 -->
    <button class="rlc" id="relicBtn" title="유물 상점">유물 <b id="hRelic">0</b></button>
  </div>
</header>

<main>
  <div id="field">
    <div id="world"><div id="grid"></div></div>
    <div class="viewbtns">
      <button id="runBtn" title="뽑기·합성까지 알아서 한다">⚙</button>
      <button id="autoBtn" title="웨이브가 알아서 이어진다">∞</button>
      <button id="spdBtn" title="배속">1×</button>
      <button id="fitBtn" title="전체 보기">⤢</button>
      <button id="zinBtn" title="확대">＋</button>
      <button id="zoutBtn" title="축소">－</button>
    </div>
    <!-- **편성은 따로 본다.** 전장에서 대원이 쏘는 걸 보는 건 그대로 두되(그게 이 장르의
         재미다), 누구를 넣고 뺄지는 칩 대신 제대로 된 화면에서 고른다 — 창고가 열 기를
         넘어가면 44px 칩으로는 무엇이 있는지조차 안 읽힌다. -->
    <div id="squad"><div class="box">
      <h2>벙커 편성</h2>
      <div class="note" id="sqNote"></div>
      <div class="sqslots" id="sqSlots"></div>
      <h3 class="sqh">창고 <span class="dim" id="sqBoxN"></span></h3>
      <div class="sqbox" id="sqBox"></div>
      <button id="sqClose" style="margin-top:16px;padding:11px 26px">닫는다</button>
    </div></div>
    <div id="over"><div class="box">
      <h2 id="overT"></h2>
      <div class="note" id="overD" style="font-size:13px"></div>
      <div class="shopwrap">
        <h3>유물로 영구히 세진다 <span class="dim">(가진 유물 <b id="shopHave">0</b>)</span></h3>
        <div class="shop" id="shop"></div>
      </div>
      <div class="shopwrap">
        <h3>도감 <span class="dim"><b id="dexHave">0</b>/<b id="dexAll">0</b> 병과 · 만난 최고 등급이 남는다</span></h3>
        <div class="dex" id="dex"></div>
      </div>
      <button id="again" style="margin-top:16px;padding:11px 26px">한 판 더</button>
    </div></div>
  </div>

  <aside>
    <section>
      <div class="toprow">
        <button class="wide roll" id="rollBtn">뽑는다 <span class="c" id="rollCost"></span></button>
        <button class="wide roll" id="waveBtn2"></button>
      </div>
      <div class="note" id="rollNote"></div>
      <div class="poolrow" id="poolRow"></div>
      <div class="note helpnote" style="margin-top:10px;color:#5f6874">
        가운데 <b style="color:var(--steel)">본진</b>을 지킨다. 적은 <b>사방에서</b> 곧장 밀려온다.<br>
        가는 길에 타워가 있으면 <b>그걸 먼저</b> 친다 — 바깥에 세우면 방벽이 되지만 얻어맞는다.<br>
        웨이브가 끝나면 성한 것은 스스로 추스른다.
      </div>
    </section>

    <section class="wavesec">
      <h3>다음 웨이브</h3>
      <button class="wide" id="waveBtn"></button>
      <div class="note" id="waveNote"></div>
    </section>

    <section>
      <h3>가진 것 <span class="dim" id="holdHint"></span>
        <button id="squadBtn" class="sqopen">편성</button></h3>
      <div class="tally" id="tally"></div>
      <div class="rowbtn">
        <button id="mergeBtn" style="flex:1">셋을 합친다</button>
        <button id="sellBtn">판다</button>
      </div>
      <div class="note helpnote">같은 등급 셋이 모이면 한 등급 위가 된다.</div>
      <div id="selInfo"></div>
    </section>

    <section>
      <h3>기록</h3>
      <div id="log"></div>
    </section>
  </aside>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   유닛 — 등급이 오르면 **눈에 띄게** 세져야 한다.
   합성이 "조금 나아짐"이면 셋을 모을 이유가 없다. 등급마다 피해가 3배씩 뛴다.
   대신 사거리·속도는 종류가 정한다 — 그래야 어느 종류를 키울지가 선택이 된다.
   ══════════════════════════════════════════════════════════ */
/** **벙커에 넣는 건 포탑이 아니라 대원이다.**
 *  자리에 놓는 것이 구조물이면 아무리 "할당"이라 불러도 화면에는 타워를 세우는 게임으로
 *  보인다. 병과가 곧 벙커의 성격이다 — 무엇을 넣느냐로 공격도 방어도 갈린다.
 *  뒤의 넷은 **때리는 것 말고 다른 일**을 한다. 숫자만 다른 병과는 늘려 봐야 목록만 길어진다. */
const KINDS = {
  gun:   { n:"소총병", ico:"⌖", col:"#c9ccd1", dmg:6,  rng:140, cd:0.55, fx:"hit",
           d:"고르게 쏜다" },
  cannon:{ n:"척탄병", ico:"◉", col:"#d0785a", dmg:22, rng:118, cd:1.5,  splash:44, fx:"blast",
           d:"느리지만 터진다" },
  frost: { n:"냉동병", ico:"❆", col:"#6ba8d6", dmg:4,  rng:132, cd:0.7,  slow:0.45, fx:"frost",
           d:"느리게 만든다" },
  bolt:  { n:"전격병", ico:"⚡", col:"#a978c9", dmg:11, rng:172, cd:0.9,  chain:2, fx:"spark",
           d:"멀리, 여럿에게 튄다" },
  // ── 뽑기에 결이 생기게 넷을 더한다. **숫자만 다른 유닛은 늘려 봐야 목록만 길어진다** —
  //    저마다 "이건 이럴 때 쓴다"가 달라야 뽑을 때마다 판이 달라진다.
  flame: { n:"화염병", ico:"🔥", col:"#e08a3c", dmg:5, rng:96, cd:0.3, splash:30, fx:"blast",
           d:"코앞을 빠르게 태운다" },
  rail:  { n:"저격수", ico:"↟", col:"#dfe6ee", dmg:46, rng:230, cd:2.4, pierce:3, fx:"spark",
           d:"아주 멀리, 뚫고 지나간다" },
  drone: { n:"정찰병", ico:"✈", col:"#7fb069", dmg:7, rng:150, cd:0.8, bounty:2, fx:"hit",
           d:"잡을 때마다 골드를 더 준다" },
  mine:  { n:"공병",   ico:"◇", col:"#e0c458", dmg:34, rng:70, cd:2.0, splash:52, arm:true, fx:"blast",
           d:"붙은 놈들을 한꺼번에" },
  // ── 때리는 것 말고 다른 일을 하는 넷 ──
  medic:  { n:"위생병", ico:"✚", col:"#e2b8b8", dmg:3, rng:110, cd:1.1, heal:7, fx:"hit",
            d:"싸우는 동안 본진을 고친다" },
  guard:  { n:"방패병", ico:"▣", col:"#8f9aa8", dmg:8, rng:88, cd:0.9, armor:0.24, fx:"hit",
            d:"본진이 받는 피해를 줄인다" },
  rocket: { n:"로켓병", ico:"➶", col:"#6f8f5a", dmg:62, rng:196, cd:2.8, splash:58, fx:"blast",
            d:"한 발이 무겁다" },
  officer:{ n:"지휘관", ico:"★", col:"#d6a84a", dmg:9, rng:150, cd:1.0, aura:0.22, fx:"hit",
            d:"벙커 전원의 피해를 올린다" },
};
const KIND_IDS = Object.keys(KINDS);
const GRADE = [1,2,3,4,5];
const gradeMul = (g) => Math.pow(3, g - 1);          // 1 · 3 · 9 · 27 · 81
const GNAME = ["", "하급", "중급", "상급", "정예", "전설"];
const GCOL  = ["", "#8a8f98", "#7fb069", "#6ba8d6", "#a978c9", "#e0a458"];

/** **자리를 셋으로 조인 만큼 하나가 세야 한다.**
 *  전에는 자리가 백열두 개여서 열댓 기가 동시에 쐈다. 벙커에 셋만 들어가는데 그때 수치를
 *  그대로 두니 화력이 5분의 1 이 되어 3~5 라운드에서 죽었고, 뽑기 횟수가 모자라 같은 것
 *  셋을 모을 수가 없어 합성까지 같이 죽었다. 자리 수가 줄면 개당 화력은 그만큼 올라야 한다. */
const BUNKER_DMG = 4.5;
/** 지휘관은 **벙커 전원**의 피해를 올린다. 사거리를 두지 않는 건 벙커이기 때문이다 —
 *  같은 건물 안이라 누가 누구 옆인지를 따질 것이 없다. 여럿 넣으면 그만큼 쌓인다. */
const auraMul = () => 1 + placed().reduce(
  (s, t) => s + (KINDS[t.kind].aura || 0) * (1 + (t.g - 1) * 0.5) * kindSkill(t.kind), 0);
const dmgOf  = (t) => Math.round(KINDS[t.kind].dmg * BUNKER_DMG * gradeMul(t.g) * metaDmg()
                                 * auraMul() * kindDmgMul(t.kind));
/** 방패병이 있으면 본진이 받는 피해가 준다. 여럿 넣으면 곱으로 쌓이되 바닥을 둔다 —
 *  방패병만 채워 무적이 되면 그건 방어가 아니라 정답이 하나뿐인 판이 된다. */
const armorMul = () => {
  let m = 1;
  for (const t of placed()) {
    const a = KINDS[t.kind].armor;
    if (a) m *= 1 - Math.min(0.6, a * (1 + (t.g - 1) * 0.35) * kindSkill(t.kind));
  }
  return Math.max(0.28, m);
};
/** **반대편 대원도 닿아야 한다.**
 *  자리는 사방으로 흩어 열리는데 적은 한 갈래로 온다. 본진이 3×3(192px)이라 반대편
 *  대원까지는 300px 이 넘는데 사거리는 88~230 이었다 — 셋 중 하나만 싸우고 둘은 구경만
 *  하다 본진이 무너졌다(여섯 판 중 두 판이 1R). 벙커 하나에 다 들어가 있는 것이니
 *  사거리는 그 벙커를 덮을 만해야 한다. 병과별 차이는 배수라 그대로 남는다. */
const BUNKER_RNG = 1.9;
const rngOf  = (t) => Math.round((KINDS[t.kind].rng + (t.g - 1) * 9) * BUNKER_RNG * kindRngMul(t.kind));
const sellOf = (t) => Math.round(12 * gradeMul(t.g) * 0.55);
// 타워도 맞는다. 등급이 오르면 단단해지되 피해만큼 뛰지는 않는다 —
// 세다고 안 부서지면 바깥에 세우는 데 값이 없어진다.
// 대원은 이제 안 죽는다(벙커가 대신 맞는다). 이 값은 표시용으로만 남는다.
const hpOf   = (t) => Math.round(28 + t.g * 22);

/* ══════════════════════════════════════════════════════════════
   전장 — **벙커디펜스.**
   ──────────────────────────────────────────────────────────────
   길을 따라가는 타워디펜스에서는 배치가 사실상 "길 옆이냐 아니냐" 하나뿐이다.
   가운데 지킬 것을 놓고 **사방에서 몰려오게** 하면 배치가 진짜 결정이 된다 —
   한쪽에 몰아 세우면 반대쪽이 그대로 뚫리고, 고르게 펴면 어디도 두껍지 않다.

   그리고 **타워가 방벽 노릇을 한다.** 적은 가는 길에 타워가 있으면 그걸 먼저 친다.
   그래서 바깥에 세운 것은 일찍 요격하지만 얻어맞고, 안쪽에 세운 것은 안전하지만
   본진이 먼저 맞는다. 이게 벙커디펜스의 결이다.

/** **판은 넉넉해야 판으로 보인다.** 처음엔 13×9(117칸) 였는데, 놓을 수 있는 자리 바깥이

const gcd = (a, b) => (b ? gcd(b, a % b) : a);

    const t = CORE.y - r, u = CORE.y + CORE.h - 1 + r;
    const ring = [];
    for (let x = a; x <= b; x++) { ring.push([x, t]); ring.push([x, u]); }
    for (let y = t + 1; y <= u - 1; y++) { ring.push([a, y]); ring.push([b, y]); }
    ring.sort((p, q) => Math.atan2(p[1] - c.y, p[0] - c.x) - Math.atan2(q[1] - c.y, q[0] - c.x));

    while (gcd(step, ring.length) !== 1) step += 2;      // 서로소여야 한 바퀴에 다 들른다

  const f = $("field").getBoundingClientRect();
  if (!f.width || !f.height) return;
  /* **적이 나오는 원까지 담는다.** 놓을 수 있는 자리(576px)에 딱 맞추면 화면이 터로만 꽉
     차서, 판을 21×21 로 넓혀도 플레이 중엔 그 벌판이 한 줄도 안 보인다 — 넓힌 게 헛일이 된다.
     스폰 원의 1.75배로 잡으면 칸이 40px 로 여전히 누를 만하면서, **가장자리에 벌판과
     적이 나오는 자리가 같이 들어온다.** */
  /* 1.75 는 앞마당이 9×9 이던 시절의 값이다. 벙커가 자리를 따라 자라게 바뀌면서 첫 판
     앞마당이 5×5 로 작아졌고, 그대로 두니 벙커가 벌판 한가운데 점처럼 보였다. */
  const need = spawnRadius() * 1.45;
  V.z = Math.max(V.minZ, Math.min(V.maxZ, Math.min(f.width, f.height) / need));
  const c = { x: (CORE.x + CORE.w / 2) * CELL, y: (CORE.y + CORE.h / 2) * CELL };
  V.x = f.width / 2 - c.x * V.z;
  V.y = f.height / 2 - c.y * V.z;
  clampView(); applyView();
}

/** 판 전체가 보이는 배율. 어디서 오는지 한눈에 보고 싶을 때. */
function fitView() {
  const f = $("field").getBoundingClientRect();
  if (!f.width || !f.height) return;
  V.z = Math.min(f.width / WORLD_W, f.height / WORLD_H) * 0.98;
  V.z = Math.max(V.minZ, Math.min(V.maxZ, V.z));
  V.x = (f.width  - WORLD_W * V.z) / 2;
  V.y = (f.height - WORLD_H * V.z) / 2;
  applyView();
}

/** 화면의 어느 점을 붙잡은 채 배율만 바꾼다 — 손가락 밑의 것이 제자리에 있어야 어지럽지 않다. */
function zoomAt(sx, sy, nz) {
  const f = $("field").getBoundingClientRect();
  const px0 = sx - f.left, py0 = sy - f.top;
  const wx = (px0 - V.x) / V.z, wy = (py0 - V.y) / V.z;
  V.z = Math.max(V.minZ, Math.min(V.maxZ, nz));
  V.x = px0 - wx * V.z;
  V.y = py0 - wy * V.z;
  clampView();
  applyView();
}

/** 판을 화면 밖으로 완전히 밀어내지 못하게 — 한 번 놓치면 돌아올 길이 없다. */
function clampView() {
  const f = $("field").getBoundingClientRect();
  const w = WORLD_W * V.z, h = WORLD_H * V.z;
  const mx = Math.min(80, f.width * 0.3), my = Math.min(80, f.height * 0.3);
  V.x = w <= f.width  ? (f.width  - w) / 2 : Math.min(mx, Math.max(f.width  - w - mx, V.x));
  V.y = h <= f.height ? (f.height - h) / 2 : Math.min(my, Math.max(f.height - h - my, V.y));
}

function layout() {
  drawGrid();
  focusView();
}
const px = (gx) => OX + gx * CELL;
const py = (gy) => OY + gy * CELL;
const cx = (gx) => px(gx) + CELL / 2;
const cy = (gy) => py(gy) + CELL / 2;

/* ══════════════════════════════════════════════════════════════
   땅의 결 — **넓힌 판이 벽지가 되지 않게**
   ──────────────────────────────────────────────────────────────
   한 장짜리 흙 타일을 441번 반복하면 넓힌 것이 오히려 더 허전해 보인다(실제로 그랬다).
   그래서 결만 다른 땅을 여러 장 두고 칸마다 골라 깔고, 드문드문 잔해를 얹는다.
   고르는 값은 **좌표에서 나온 해시**다 — 다시 그려도 같은 자리에 같은 것이 온다.
   난수로 두면 웨이브 화살표가 바뀔 때마다 땅이 통째로 갈려 화면이 튄다.
   ══════════════════════════════════════════════════════════ */
const hash2 = (x, y, salt = 0) => {

  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;

/** **땅은 이제 한 세트로 구운 Wang 타일셋이다** (PixelLab create_topdown_tileset, 64px 16장).
 *
 *  낱장 흙 그림을 여섯 장 굽고 돌려 깔던 방식은 아무리 이어 붙여도 칸 경계가 읽혔다 —
 *  생성 모델이 64px 안에서 그림을 "완결"시키기 때문에 가장자리가 안쪽과 다르게 끝난다.
 *  Wang 타일은 **네 모서리의 지형이 무엇인지**를 정해 놓고 굽기 때문에 이웃과 맞물린다.
 *  덤으로 벌판(lower=갈라진 콘크리트)과 터(upper=리벳 철판)의 **경계 타일까지 한 세트**라,
 *  터가 벌판에 얹힌 판때기가 아니라 땅에 깔린 바닥으로 읽힌다.
 *
 *  키는 NW·NE·SW·SE 순서의 네 자리(1=터, 0=벌판)이고 값은 시트에서의 칸 [열, 행]이다.
 *  시트 위치는 **배열 순서**로만 잡는다 — 타일 이름(wang_N)이나 original_position 을 쓰면
 *  가로로 밴딩이 생긴다(PixelLab 문서가 명시한 함정). */
const WANG = {"0000":[2,1],"0001":[3,1],"0010":[2,2],"0011":[1,2],"0100":[2,0],"0101":[3,2],
              "0110":[0,1],"0111":[3,3],"1000":[1,1],"1001":[2,3],"1010":[1,0],"1011":[0,2],
              "1100":[3,0],"1101":[0,0],"1110":[1,3],"1111":[0,3]};
/** 모서리가 터 안쪽인가. **모서리 격자는 칸 격자보다 하나 크다** — 터가 [a,b] 칸이면
 *  모서리는 [a,b+1] 이다. 이걸 칸 범위로 재면 터 둘레가 한 줄씩 어긋난다. */
const cornerUp = (cx, cy) =>
  cx >= CORE.x - DECK_R && cx <= CORE.x + CORE.w + DECK_R &&
  cy >= CORE.y - DECK_R && cy <= CORE.y + CORE.h + DECK_R;
const DECOS = ["wreck", "crates", "pipe", "boulder", "bones", "crystal", "barrel", "antenna"];
const pick = (arr, r) => arr[Math.min(arr.length - 1, Math.floor(r * arr.length))];

function drawGrid() {
  let h = "";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (inCore(x, y)) continue;                    // 본진은 아래에서 한 덩이로 그린다
    /* 네 모서리가 각각 터인지 벌판인지로 깔 타일이 정해진다 — 그게 Wang 타일의 전부다. */
    const k = (cornerUp(x, y)     ? "1" : "0") + (cornerUp(x + 1, y)     ? "1" : "0") +
              (cornerUp(x, y + 1) ? "1" : "0") + (cornerUp(x + 1, y + 1) ? "1" : "0");
    const [tc, tr] = WANG[k];
    h += `<div class="tile wang"
      style="left:${px(x)}px;top:${py(y)}px;width:${CELL}px;height:${CELL}px;` +
      `background-position:${-tc * CELL}px ${-tr * CELL}px"></div>`;
  }
  /* 자리 — 땅 **위에 얹는 구획선**이다. 땅과 층을 나눠야 땅이 안 끊긴다.
     아직 안 열린 칸은 어둡게 덮어 둔다. **비워 두면 안 된다** — 증축으로 뭐가 늘어나는지가
     안 보이면 그 업그레이드는 숫자일 뿐이고, 늘어나는 걸 보는 게 이 게임의 재미다. */
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!onDeck(x, y)) continue;
    const open = buildable(x, y);
    h += `<div class="slot${open ? "" : " locked"}" ${open ? `data-x="${x}" data-y="${y}"` : ""}
      style="left:${px(x)}px;top:${py(y)}px;width:${CELL}px;height:${CELL}px"></div>`;
  }
  /* 잔해 — 벌판의 1/9 쯤에만 얹는다. 촘촘하면 적이 어디 있는지 안 읽히고,
     없으면 그냥 빈 땅이다. 놓는 자리(터)와 그 한 칸 밖은 비워 둔다 —
     타워와 겹쳐 보이면 뭐가 내 것인지 헷갈린다. */
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (onDeck(x, y) || inCore(x, y)) continue;
    if (Math.abs(x - (CORE.x + 1)) <= RING + 1 && Math.abs(y - (CORE.y + 1)) <= RING + 1) continue;
    /* **고르게 뿌리면 잔해도 격자가 된다.** 칸마다 같은 확률로 굴렸더니 벌판이 고물상처럼
       빽빽해지고, 그마저 줄 맞춰 늘어서 보였다. 세 칸 단위의 성긴 노이즈로 **동네마다 밀도를
       달리** 해서 뭉친 데는 뭉치고 빈 데는 시원하게 비운다. */
    const clump = hash2(Math.floor(x / 3), Math.floor(y / 3), 41);
    if (hash2(x, y, 11) > 0.07 + clump * 0.21) continue;
    const d = pick(DECOS, hash2(x, y, 19));
    const sz = CELL * (0.55 + hash2(x, y, 23) * 0.35);
    const jx = (hash2(x, y, 29) - 0.5) * CELL * 0.55, jy = (hash2(x, y, 31) - 0.5) * CELL * 0.55;
    h += `<img class="deco" src="assets/deco/${d}.png" alt="" onerror="this.remove()"` +
         ` style="left:${cx(x) + jx}px;top:${cy(y) + jy}px;width:${sz}px;height:${sz}px">`;
  }
  // **다음 웨이브가 어디서 오는지 미리 보여 준다.** 안 보여 주면 첫 라운드는 무조건 헛방이고,
  // 그건 배치가 아니라 운이다. 화살표는 **적이 실제로 나오는 자리**에 선다 —
  // 판을 넓히고 나서도 가장자리에 두면 아무것도 없는 벌판 끝을 가리키게 된다.
  {
    const c = coreCenter();
    const rad = spawnRadius() + CELL * 0.35;
    for (const th of waveLanes(S.round)) {
      const ax = c.x + Math.cos(th) * rad, ay = c.y + Math.sin(th) * rad;
      h += `<div class="lane" style="left:${ax}px;top:${ay}px;` +
           `transform:translate(-50%,-50%) rotate(${th + Math.PI / 2}rad)">▼</div>`;
    }
  }

  // 본진 — 칸을 쪼개지 않고 **한 덩이**로 그린다. 조각으로 두면 지킬 것이 아니라 타일로 읽힌다.
  h += `<div class="core" id="coreEl"
    style="left:${px(CORE.x)}px;top:${py(CORE.y)}px;width:${CELL*CORE.w-2}px;height:${CELL*CORE.h-2}px">
      <img class="cspr" src="assets/unit/bunker.png" alt=""
        onerror="this.parentNode&amp;&amp;this.parentNode.classList.add('noimg');this.remove()">
      <div class="cbar"><i id="coreBar"></i></div>
      <div class="cnum" id="coreNum"></div>
    </div>`;
  h += `<div class="vignette"></div>`;   // 맨 나중에 — 땅과 잔해만 덮고 몹·타워는 못 덮게
  $("grid").innerHTML = h;
  drawTowers();
}

/* ══ 로그 ══ */
const say = (html) => {
  $("log").insertAdjacentHTML("afterbegin", `<div>${html}</div>`);
  while ($("log").children.length > 30) $("log").lastChild.remove();
};

/* ══════════════════════════════════════════════════════════════
   뽑기 — 이 게임의 도파민.
   라운드가 오를수록 좋은 게 나올 확률이 오른다. 안 그러면 후반에도 하급만 나와
   "뽑는다"가 벌금이 된다. 다만 상급 이상은 뽑기로 못 나온다 — **합성만이 길**이어야
   셋을 모으는 행동에 값이 생긴다.
   ══════════════════════════════════════════════════════════ */
function roll() {
  const c = rollCost();
  if (S.gold < c) return;
  S.gold -= c; S.rolls++;

  const kind = S.pool[Math.floor(Math.random() * S.pool.length)];
  // **중급이 섞여 나와야 상급까지 길이 열린다.** 예전 식은 1라운드 확률이 0% 여서
  // 상급 하나에 하급 아홉이 필요했고, 그건 열 라운드 안에 도달할 수 있는 수가 아니었다.
  const p = Math.random() + Math.min(0.34, S.round * 0.022) + META.up.luck * 0.05;
  const g = p > 0.86 ? 2 : 1;                    // 뽑기로는 중급까지만
  /* **자리가 없다고 못 뽑으면 안 된다.** 뽑는 이유의 절반은 합성할 셋을 모으는 것이고,
     자리 셋에 막히면 그 절반이 통째로 사라진다. 남았으면 바로 내보내고 없으면 창고에 둔다. */
  const free = freeSlots();
  const slot = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  const t = { id: nextId++, kind, g, x: slot ? slot.x : null, y: slot ? slot.y : null };
  t.hp = t.maxHp = hpOf(t);
  S.towers.push(t);
  S.sel = t.id;
  const fresh = noteSeen(kind, g);
  say((fresh ? `<b style="color:var(--amber)">새 병과!</b> ` : "") +
      `<b>${GNAME[g]} ${KINDS[kind].n}</b> 을(를) 뽑았다.` + (slot ? "" : " 자리가 없어 창고로."));
  refresh();
  if (slot) popTower(t, "rolled");  // 어디에 떨어졌는지 눈이 따라가야 한다
}

/** **가진 것과 내보낸 것은 다르다.**
 *
 *  자리를 셋으로 조였더니 가진 것도 셋이 되어 같은 종류 셋을 모을 수가 없었고, 합성이
 *  통째로 죽었다(검증 봇 최고 등급 3.0 → 1.5). 벙커에 "할당한다"는 건 가진 것 중에서
 *  **골라 넣는다**는 뜻이지, 뽑은 것이 곧바로 자리에 꽂힌다는 뜻이 아니다.
 *  그래서 뽑은 것은 제한 없이 쌓이고, 그중 자리에 넣은 것만 싸운다.
 *  자리에 없는 것은 `x` 가 null 이다 — 합성·판매는 가진 것 전부를 대상으로 한다. */
const isOut = (t) => t.x !== null;                 // 내보냈는가(자리에 있는가)
const placed = () => S.towers.filter(isOut);
const inBox = () => S.towers.filter(t => !isOut(t));
const occupied = () => new Set(placed().map(t => t.x+","+t.y));
function freeSlots() {
  const occ = occupied(), out = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (buildable(x, y) && !occ.has(x+","+y)) out.push({ x, y });
  }
  return out;
}

/** **빈 자리는 알아서 채운다.** 자리를 비워 두는 건 손해일 뿐 결정이 아니다 — 합치고 나서
 *  매번 손으로 두 자리를 채우게 하면 그건 결정이 아니라 잔일이다. 센 것부터 내보내고,
 *  무엇을 내보낼지는 진열대의 칩을 눌러 언제든 바꾼다. */
function fillFree() {
  const box = inBox().sort((a, b) => (b.g - a.g) || (dmgOf(b) - dmgOf(a)));
  for (const t of box) {
    const free = freeSlots();
    if (!free.length) break;
    const s = free[Math.floor(Math.random() * free.length)];
    t.x = s.x; t.y = s.y;
  }
}

/** 진열대의 칩을 눌렀을 때 — 창고에 있으면 내보내고, 다 나가 있으면 하나 거둔다. */
function toggleOut(key) {
  const [kind, gs] = key.split(":"); const g = +gs;
  const mine = S.towers.filter(t => t.kind === kind && t.g === g);
  const waiting = mine.filter(t => !isOut(t));
  if (waiting.length) {
    const free = freeSlots();
    if (!free.length) { say("자리가 다 찼다. 하나를 거두거나 증축해야 한다."); return; }
    const t = waiting[0], s = free[Math.floor(Math.random() * free.length)];
    t.x = s.x; t.y = s.y; S.sel = t.id;
    refresh(); popTower(t, "rolled");
  } else {
    const out = mine.filter(isOut);
    if (!out.length) return;
    const t = out[out.length - 1];
    t.x = t.y = null;
    if (S.sel === t.id) S.sel = null;
    say(`<b>${GNAME[g]} ${KINDS[kind].n}</b> 을(를) 거뒀다.`);
    refresh();
  }
}

/* ══ 합성 — 같은 종류·같은 등급 셋 ══ */
function mergeGroups() {
  const m = new Map();
  for (const t of S.towers) {
    const k = t.kind + ":" + t.g;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(t);
  }
  return m;
}
function canMerge() {
  for (const [k, arr] of mergeGroups()) {
    const g = +k.split(":")[1];
    if (g < 5 && arr.length >= 3) return k;
  }
  return null;
}
const merge = () => mergeKey(canMerge());
function mergeKey(k) {
  if (!k) return;
  const [kind, gs] = k.split(":");
  const g = +gs;
  const arr = mergeGroups().get(k).slice(0, 3);
  // **가장 좋은 자리를 남긴다** — 합쳤더니 구석에 서 있으면 억울하다.
  // 자리에 나가 있는 것이 창고에 있는 것보다 늘 먼저다(창고 것은 덮는 게 없다).
  arr.sort((a, b) => (isOut(b) - isOut(a)) || (coverOf(b) - coverOf(a)));
  const keep = arr[0];
  const gone = new Set(arr.slice(1).map(t => t.id));
  S.towers = S.towers.filter(t => !gone.has(t.id));
  keep.g = g + 1;
  keep.maxHp = hpOf(keep); keep.hp = keep.maxHp;     // 합치면 새것처럼 선다
  S.sel = keep.id;
  fillFree();                                        // 셋이 하나가 되며 빈 두 자리를 메운다
  noteSeen(kind, keep.g);                            // 합쳐 오른 등급도 도감에 남는다
  say(`셋을 합쳐 <b style="color:${GCOL[keep.g]}">${GNAME[keep.g]} ${KINDS[kind].n}</b> 이(가) 되었다.`);
  flyText(cx(keep.x), cy(keep.y), GNAME[keep.g], GCOL[keep.g]);
  refresh();
  popTower(keep, "merged");
}
// **본진을 얼마나 감싸는가.** 본진 둘레를 한 바퀴 돌며 사거리에 드는 각도를 센다 —
// 합성 때 어느 자리를 남길지, 그리고 지금 자리가 쓸 만한지의 기준.
function coverOf(t) {
  const r = rngOf(t), tx = cx(t.x), ty = cy(t.y);
  const c = coreCenter(), rad = coreRadius() + CELL * 0.5;
  let n = 0;
  for (let a = 0; a < 24; a++) {
    const th = a / 24 * Math.PI * 2;
    if (Math.hypot(c.x + Math.cos(th) * rad - tx, c.y + Math.sin(th) * rad - ty) <= r) n++;
  }
  return n;
}
const coreCenter = () => ({ x: px(CORE.x) + CELL * CORE.w / 2, y: py(CORE.y) + CELL * CORE.h / 2 });
const coreRadius = () => CELL * CORE.w / 2;
/** **적이 나오는 반지름 — 놓을 수 있는 자리 바로 바깥.**
 *  판을 21×21 로 넓혔다고 이걸 같이 밀면 안 된다. 바로 앞 판에서 "적군이 너무 멀리서
 *  나온다"는 말을 듣고 526 → 326 으로 당긴 자리다. **넓힌 땅은 배경이지 싸움터가 아니다** —
 *  싸움은 여전히 본진 코앞에서 벌어지고, 벌판은 그 뒤로 펼쳐져 판을 판처럼 보이게 할 뿐이다.
 *  (RING 이 2→3 이 되면서 326 → 390 으로 한 칸만큼만 따라 밀렸다.)
 *  웨이브 화살표도 여기 선다 — 가리키는 곳과 나오는 곳이 다르면 미리 보여 주는 뜻이 없다. */
const spawnRadius = () => coreRadius() + CELL * (RING + 1.6);

function sell() {
  const t = S.towers.find(x => x.id === S.sel);
  if (!t) return;
  S.gold += sellOf(t);
  S.towers = S.towers.filter(x => x.id !== t.id);
  S.sel = null;
  say(`${GNAME[t.g]} ${KINDS[t.kind].n} 을(를) 팔았다. +${sellOf(t)}`);
  fillFree();                       // 판 자리는 창고에 있는 것이 이어받는다
  refresh();
}

/* ══ 배치 옮기기 — 빈 슬롯을 누르면 고른 타워가 그리로 간다 ══ */
$("grid").addEventListener("click", (e) => {
  const el = e.target.closest("[data-x]");
  if (!el) return;
  const x = +el.dataset.x, y = +el.dataset.y;
  const here = S.towers.find(t => t.x === x && t.y === y);
  if (here) { S.sel = (S.sel === here.id) ? null : here.id; refresh(); return; }
  const t = S.towers.find(t => t.id === S.sel);
  if (t) { t.x = x; t.y = y; refresh(); }
});

/* ══════════════════════════════════════════════════════════════
   웨이브 — **자동으로 싸운다.** 내가 짜 놓은 것이 나 없이 막는 걸 지켜보는 것이
   이 장르의 심장이다. 그래서 전투 중에는 손댈 것을 일부러 두지 않았다.
   ══════════════════════════════════════════════════════════ */
const WAVE_GAP = 3.5;                  // 웨이브 사이에 숨 돌리는 시간(초)

function startWave() {
  if (S.running || S.over) return;
  S.gap = 0;                           // 손으로 눌렀으면 기다리던 시간은 없던 일이 된다
  S.running = true;
  S.toSpawn = waveN(S.round);
  S.spawned = 0; S.spawnT = 0;
  say(`── <b>${S.round}라운드</b>${isBossR(S.round) ? " · 큰 놈이 온다" : ""}`);
  refresh();
}

/** 이번 웨이브가 어느 방향에서 오는가. **라운드가 오를수록 갈래가 는다** —
 *  한 쪽만 두껍게 막아 두고 넘어가지 못하게 하는 것이 이 구조의 핵심 압박이다. */
function waveLanes(r) {
  const n = Math.min(4, 1 + Math.floor((r - 1) / 3));
  const base = (r * 1.7) % (Math.PI * 2);          // 라운드마다 방향이 돌아간다
  return Array.from({ length: n }, (_, i) => base + i * (Math.PI * 2 / n));
}

function spawnMob() {
  const boss = isBossR(S.round) && S.spawned === 0;
  /* **체력을 흩뿌린다.** 모두 같은 체력이면 한 웨이브가 통째로 죽거나 통째로 살아남는다 —
     화력이 감당하는 동안은 한 대도 안 맞다가, 한계를 넘는 순간 수십 마리가 동시에 도달해
     끝난다(재 보니 처음 맞은 라운드와 죽는 라운드가 1~5 라운드밖에 차이가 안 났다).
     편차를 주면 두꺼운 놈부터 새어 들어와 본진을 조금씩 깎고, 그 비율이 라운드를 따라
     서서히 는다. 낭떠러지가 비탈이 된다. */
  const hp = waveHp(S.round) * (boss ? 8 : 0.55 + Math.random() * 1.15);
  const lanes = waveLanes(S.round);
  // 같은 갈래라도 조금씩 흩뿌린다 — 한 줄로 오면 한 타워가 다 잡는다
  const th = lanes[S.spawned % lanes.length] + (Math.random() - 0.5) * 0.5;
  // 라운드가 오를수록 험한 놈이 섞인다. 종류는 겉모습과 결만 바꾼다 —
  // 수치를 종마다 따로 두면 밸런스 손잡이가 배로 늘어난다.
  const pool = S.round < 3 ? ["grunt"] : S.round < 6 ? ["grunt","runner"]
             : S.round < 10 ? ["grunt","runner","brute"] : ["grunt","runner","brute","swarm","shield"];
  const kind = boss ? "boss" : pool[Math.floor(Math.random() * pool.length)];
  const c = coreCenter();
  // **놓을 수 있는 자리 바로 바깥에서 나온다.** 예전엔 판 대각선의 절반(526px)에서
  // 출발했는데, 그건 배치 구역(반지름 224) 한참 밖이라 화면에 없는 데서 한참을 걸어온다 —
  // 나오는 것도 안 보이고, 보일 때쯤엔 이미 코앞이다.
  const far = spawnRadius();
  S.mobs.push({
    id: nextId++, hp, maxHp: hp, boss, th, kind,
    x: c.x + Math.cos(th) * far, y: c.y + Math.sin(th) * far,
    /* **속도는 건드리지 않는다.** 달려올 거리가 230 → 294px 로 늘었다고 속도를 같이 올리면
       도착 시간은 같아져도 **사거리 안에 머무는 시간이 그만큼 줄어** 난이도가 올라간다
       (타워가 쏘는 총량 = 사거리 ÷ 속도). 실제로 31 로 올렸더니 아무렇게나 세운 봇이
       5.2R → 2.8R 로 주저앉았다. 더 걸리는 2.6초는 배속으로 넘긴다. */
    speed: (boss ? 15 : 24) * (1 + (S.round - 1) * 0.02),   // px/초
    // 한 대는 가볍게, 대신 **여럿이 오래** — 그래야 고치고 막는 병과가 값을 한다
    dmg: Math.round((2 + S.round * 0.28) * (boss ? 4 : 1)),
    slow: 0, slowT: 0, atkT: 0,
  });
  S.spawned++;
}

const mobPos = (m) => ({ x: m.x, y: m.y });
// 본진까지 남은 거리 — 타워는 **제일 가까이 온 놈**부터 노린다
const distToCore = (m) => Math.hypot(m.x - coreCenter().x, m.y - coreCenter().y) - coreRadius();

function hurt(m, d, from) {
  m.hp -= d;
  if (m.hp <= 0) {
    m.dead = true;
    const bounty = from && KINDS[from.kind].bounty ? KINDS[from.kind].bounty : 1;
    const g = Math.max(1, Math.round(2 + S.round * 0.5)) * (m.boss ? 14 : 1) * bounty;
    S.gold += g;
    const p = mobPos(m);
    flyText(p.x, p.y, "+" + g, "#e0a458");
  }
}

/** 맞은 자리에 이펙트를 한 번 얹는다. 에셋이 없으면 조용히 사라진다. */
function boom(x, y, kind) {
  if (S.fxBusy > 24) return;                 // 한꺼번에 수십 개가 뜨면 프레임이 떨어진다
  S.fxBusy = (S.fxBusy || 0) + 1;
  const img = document.createElement("img");
  img.className = "boom";
  img.src = `assets/fx/${kind}.png`;
  img.style.cssText = `left:${x}px;top:${y}px`;
  img.onerror = () => { img.remove(); S.fxBusy--; };
  $("world").appendChild(img);
  setTimeout(() => { img.remove(); S.fxBusy--; }, 300);
}

/** 방금 생긴 것을 한 번 튀겨 준다. 목록의 숫자만 바뀌면 무슨 일이 있었는지 안 남는다. */
function popTower(t, cls) {
  const el = [...document.querySelectorAll("#world .tw")]
    .find(e => e.dataset.id === String(t.id));
  if (!el) return;
  el.classList.remove("rolled", "merged"); void el.offsetWidth; el.classList.add(cls);
}

function flyText(x, y, text, col) {
  const el = document.createElement("div");
  el.className = "fly"; el.textContent = text;
  el.style.cssText = `left:${x}px;top:${y}px;color:${col}`;
  $("world").appendChild(el);
  setTimeout(() => el.remove(), 700);
}

let last = performance.now();
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // **배속은 한 번에 크게 밀지 않고 여러 번 나눠 민다.** dt 를 통째로 곱하면 빠른 적이
  // 타워를 통과해 버리거나 코어를 지나쳐 판정이 튄다.
  if (!S.over) for (let i = 0; i < S.speed; i++) tick(dt);
  paint();
  requestAnimationFrame(step);
}

function tick(dt) {
  // 소환
  if (S.running && S.spawned < S.toSpawn) {
    S.spawnT -= dt;
    if (S.spawnT <= 0) { spawnMob(); S.spawnT = 0.55; }
  }
  // 이동과 교전.
  // **가는 길에 타워가 있으면 그걸 먼저 친다** — 그래서 바깥에 세운 타워가 방벽이 되고,
  // 일찍 요격하는 대신 얻어맞는다. 이 맞바꿈이 "어디에 놓을까"를 진짜 결정으로 만든다.
  const c = coreCenter(), cr = coreRadius();
  for (const m of S.mobs) {
    if (m.slowT > 0) { m.slowT -= dt; if (m.slowT <= 0) m.slow = 0; }
    m.atkT -= dt;

    /* **적이 노리는 건 벙커 하나다.**
     *
     *  전에는 코앞의 대원에게 막혀 그를 때렸다. 자리가 셋뿐인 구조에서 그러면 대원이
     *  죽어 없어지고 화력이 통째로 사라져 그 판이 거기서 끝난다(여섯 판 중 세 판이 1R).
     *  맞는 것을 본진으로 돌려도 마찬가지였다 — 막혀 있는 동안 그 피해가 전부 본진으로
     *  들어가 오히려 더 빨리 무너졌다. 대원은 벙커 안에 있는 것이니 **아예 맞지 않는다.**
     *  깎이는 것은 본진뿐이고, 그래서 방어는 받는 피해를 줄이는 일(방패병)과
     *  깎인 것을 되돌리는 일(위생병)로 갈린다. 잃는 것은 판이지 모아 온 대원이 아니다. */
    m.stuck = false;
    const d = Math.hypot(m.x - c.x, m.y - c.y);
    if (d <= cr + 8) {                            // 본진에 붙었다
      m.stuck = true;
      if (m.atkT <= 0) {
        m.atkT = 1;
        const hit = Math.max(1, Math.round(m.dmg * armorMul()));
        S.coreHp -= hit;
        flyText(c.x, c.y - cr, "-" + hit, "#d05353");
        if (S.coreHp <= 0) { S.coreHp = 0; gameOver(); return; }
      }
      continue;
    }
    const v = m.speed * (1 - m.slow) * dt;
    m.x += (c.x - m.x) / d * v;
    m.y += (c.y - m.y) / d * v;
  }
  S.mobs = S.mobs.filter(m => !m.dead);

  /* ══ 알아서 돌린다 ══
     **방치형은 손을 떼도 굴러가야 한다.** 웨이브만 이어지고 뽑기·합성을 손으로 눌러야 하면
     그건 방치가 아니라 그냥 버튼이 하나 줄어든 것이다. 골드가 차면 뽑고, 셋이 모이면 합치고,
     빈 자리는 채운다 — 사람에게 남는 결정은 **무엇을 내보낼지와 무엇에 유물을 쓸지**다.
     한 틱에 몰아 하지 않고 0.4초에 한 번만 손을 대, 불어나는 게 눈에 보이게 한다. */
  if (S.autoRun && !S.over) {
    S.autoT = (S.autoT || 0) - dt;
    if (S.autoT <= 0) {
      S.autoT = 0.4;
      while (canMerge()) merge();            // 합치는 게 먼저다 — 자리가 나야 뽑은 게 나간다
      let n = 0;
      while (S.gold >= rollCost() && n++ < 4) roll();
      fillFree();
    }
  }

  /* 위생병 — 싸우는 동안 **본진**을 고친다. 대원이 안 죽게 된 뒤로 깎이는 것은 본진뿐이고,
     그러니 고칠 것도 본진이다. 웨이브 도중에만 의미가 있는 힘이다. */
  for (const t of placed()) {
    const h = KINDS[t.kind].heal;
    if (!h) continue;
    t.healT = (t.healT || 0) - dt;
    if (t.healT > 0) continue;
    t.healT = 1.2;
    if (S.coreHp >= S.coreMax) continue;
    const amt = Math.max(1, Math.round(h * gradeMul(t.g) * 0.5 * kindSkill(t.kind)));
    S.coreHp = Math.min(S.coreMax, S.coreHp + amt);
    const c2 = coreCenter();
    flyText(c2.x, c2.y - coreRadius(), "+" + amt, "#7fb069");
  }

  // 대원 — **내보낸 것만 쏜다.** 창고에 있는 건 구경만 한다
  for (const t of placed()) {
    t.cd = (t.cd || 0) - dt;
    if (t.cd > 0) continue;
    const K = KINDS[t.kind], r = rngOf(t), tx = cx(t.x), ty = cy(t.y);
    // **본진에 제일 가까이 온 놈부터** 노린다 — 먼 놈을 먼저 잡으면 코앞의 것을 놓친다.
    // 지뢰밭만은 **멈춰 붙은 놈**을 노린다 — 그래야 "달라붙은 것들을 한꺼번에"가 된다.
    let best = null, bestD = 1e9;
    for (const m of S.mobs) {
      if (Math.hypot(m.x - tx, m.y - ty) > r) continue;
      if (K.arm && !m.stuck) continue;
      const d = distToCore(m);
      if (d < bestD) { bestD = d; best = m; }
    }
    if (!best) continue;
    t.cd = K.cd;
    const d = dmgOf(t);
    const bp = mobPos(best);
    S.shots.push({ x: tx, y: ty, tx: bp.x, ty: bp.y, life: 0.14, col: K.col });
    boom(bp.x, bp.y, K.fx || "hit");

    hurt(best, d, t);
    // 훈련 등급이 오르면 그 병과의 특기도 같이 자란다 — 그게 곧 스킬 성장이다
    const sk = kindSkill(t.kind);
    if (K.slow) { best.slow = Math.max(best.slow, Math.min(0.8, K.slow * sk)); best.slowT = 1.1; }
    if (K.splash) for (const m of S.mobs) {
      if (m === best || m.dead) continue;
      const p = mobPos(m);
      if (Math.hypot(p.x - bp.x, p.y - bp.y) <= K.splash * sk) hurt(m, Math.round(d * 0.55));
    }
    if (K.chain) {
      let n = K.chain + Math.floor(kindLv(t.kind) / 3);
      for (const m of S.mobs) {
        if (n <= 0) break;
        if (m === best || m.dead) continue;
        const p = mobPos(m);
        if (Math.hypot(p.x - bp.x, p.y - bp.y) <= 70) {
          hurt(m, Math.round(d * 0.5));
          S.shots.push({ x: bp.x, y: bp.y, tx: p.x, ty: p.y, life: 0.12, col: K.col });
          n--;
        }
      }
    }
    // 관통 — 탄이 지나간 **직선 위**의 것들도 맞는다. 한 갈래로 몰려오면 값을 한다.
    if (K.pierce) {
      let n = K.pierce + Math.floor(kindLv(t.kind) / 3);
      const ux = (bp.x - tx) / (Math.hypot(bp.x - tx, bp.y - ty) || 1);
      const uy = (bp.y - ty) / (Math.hypot(bp.x - tx, bp.y - ty) || 1);
      for (const m of S.mobs) {
        if (n <= 0) break;
        if (m === best || m.dead) continue;
        const rx = m.x - tx, ry = m.y - ty;
        const along = rx * ux + ry * uy;
        if (along < 0 || along > r) continue;
        if (Math.abs(rx * uy - ry * ux) > 16) continue;    // 선에서 벗어난 것은 뺀다
        hurt(m, Math.round(d * 0.7));
        n--;
      }
    }
  }
  for (const s of S.shots) s.life -= dt;
  S.shots = S.shots.filter(s => s.life > 0);

  /* **다음 웨이브는 알아서 온다.** 라운드마다 시작 버튼을 찾아 누르게 하면, 짜 놓은 것이
     나 없이 막는 걸 보는 게 아니라 매 판 손이 가는 일이 된다(병수님 지적). 막고 나면
     잠깐 숨 돌릴 틈만 주고 이어 간다 — 뽑기·합성·자리 바꾸기는 웨이브 중에도 되므로
     이 틈은 정비 시간이 아니라 **한 라운드가 끝났다는 것을 읽을 시간**이다. */
  if (!S.running && !S.over && S.auto && S.gap > 0) {
    S.gap -= dt;
    if (S.gap <= 0) { S.gap = 0; startWave(); }
  }

  // 웨이브 끝
  if (S.running && S.spawned >= S.toSpawn && !S.mobs.length) {
    S.running = false;
    S.gap = WAVE_GAP;
    // 웨이브가 끝나면 성한 것은 추스른다. 안 그러면 바깥에 두는 값이 너무 비싸다 —
    // 잃는 것은 **완전히 부서졌을 때뿐**이어야 한다.
    for (const t of S.towers) t.hp = t.maxHp;
    const bonus = 24 + S.round * 9;
    S.gold += bonus;
    const rel = relicTick(S.round);
    if (rel) {
      const first = META.relics === 0;      // 이 판에서 처음 손에 쥐는 유물인가
      META.relics += rel; saveMeta();
      // 처음 한 번은 어디서 쓰는지까지 말해 준다. 두 번째부터는 잔소리다.
      if (first) say('유물은 <b style="color:var(--amber)">위쪽 「유물」</b>을 눌러 아무 때나 쓴다.');
    }
    say(`${S.round}라운드를 막았다. <b>+${bonus}</b>` +
        (rel ? ` · <b style="color:var(--amber)">유물 +${rel}</b>` : ""));
    S.round++;
    drawGrid();            // 다음 웨이브가 오는 갈래가 바뀌었다
    refresh();
  }
}

function gameOver() {
  S.over = true; S.running = false; S.mobs = []; S.shots = [];
  document.querySelectorAll("#world .fly, #world .boom").forEach(e => e.remove());
  const got = relicsFor(S.round);
  META.relics += got;
  META.best = Math.max(META.best, S.round);
  saveMeta();
  $("overT").textContent = "뚫렸다";
  $("overD").innerHTML =
    `${S.round}라운드에서 본진이 무너졌다. 최고 기록 ${META.best}라운드.<br>` +
    `<b style="color:var(--amber)">유물 +${got}</b>`;
  drawShop();
  $("over").classList.add("on");
}

// 유물 상점. **뚫린 화면에서 바로 세지는 게 보여야** "한 판 더"에 손이 간다.
function drawShop() {
  $("shop").innerHTML = Object.entries(UPGRADES).map(([k, u]) => {
    const c = upCost(k), lv = META.up[k];
    return `<button class="up" data-up="${k}" ${META.relics < c ? "disabled" : ""}>
      <span class="n">${u.n}${lv ? ` <span class="dim">${lv}</span>` : ""}</span>
      <span class="d">${u.d}</span><span class="p">유물 ${c}</span></button>`;
  }).join("");
  $("shopHave").textContent = META.relics;

  /* 도감 — 아직 못 본 병과도 **자리를 비워 둔 채로 보여 준다.** 몇 개가 남았는지 보이지
     않으면 모을 이유가 생기지 않는다. 만난 최고 등급을 별로 남겨 다음 판을 당긴다. */
  $("dex").innerHTML = KIND_IDS.map(k => {
    const g = META.seen[k] | 0, K = KINDS[k];
    if (!g) return `<div class="dxc off" title="아직 못 만났다"><span class="ico">?</span>
           <span class="dxn">???</span></div>`;
    /* 만난 병과는 **키울 수 있다.** 도감이 보여 주기만 하면 모은 것이 결과에 안 남는다 —
       누를 수 있게 해 두면 "이번엔 저격수를 밀어 보자"가 성립한다. */
    const lv = kindLv(k), c = kindCost(k), can = META.relics >= c;
    return `<button class="dxc train${can ? " can" : ""}" data-train="${k}"
         title="${K.n} — ${K.d}&#10;훈련 ${lv}등급 · 피해 +${Math.round(kindLv(k)*16)}% · 특기 +${Math.round(kindLv(k)*11)}%">
       <img class="spr" src="assets/unit/${k}.png" alt=""
         onerror="this.parentNode&amp;&amp;this.parentNode.classList.add('noimg');this.remove()">
       <span class="ico">${K.ico}</span>
       <span class="dxn">${K.n}</span>
       <span class="dxg" style="color:${GCOL[g]}">${"★".repeat(Math.min(g,5))}</span>
       <span class="dxt">훈련 ${lv} <b>유물 ${c}</b></span></button>`;
  }).join("");
  $("dexHave").textContent = seenCount();
  $("dexAll").textContent = KIND_IDS.length;
}

/* ══ 그리기 ══ */
function drawTowers() {
  const old = [...document.querySelectorAll("#world .tw, #world .rng")];
  old.forEach(e => e.remove());
  for (const t of placed()) {
    const K = KINDS[t.kind], sel = S.sel === t.id;
    const el = document.createElement("div");
    el.className = "tw";
    el.dataset.id = t.id;
    el.style.cssText = `left:${px(t.x)}px;top:${py(t.y)}px;width:${CELL-2}px;height:${CELL-2}px;
      color:${K.col};background:${sel ? "#22201a" : "#181d25"};
      box-shadow:inset 0 0 0 1px ${GCOL[t.g]}${sel ? ",0 0 0 1px var(--amber)" : ""}`;
    const hurt = t.hp < t.maxHp;
    // **그림이 있으면 그림, 없으면 글자.** 에셋이 아직 안 구워졌다고 게임이 안 돌면 안 된다.
    el.innerHTML =
      `<img class="spr" src="assets/unit/${t.kind}.png" alt=""
         onerror="this.parentNode&amp;&amp;this.parentNode.classList.add('noimg');this.remove()">` +
      `<span class="ico">${K.ico}</span>` +
      `<span class="lvl" style="color:${GCOL[t.g]}">${"★".repeat(Math.min(t.g,5))}</span>` +
      (hurt ? `<span class="thp"><i style="width:${Math.max(0,t.hp/t.maxHp*100)}%;
        background:${t.hp/t.maxHp > .4 ? "#7fb069" : "#d05353"}"></i></span>` : "");
    $("world").appendChild(el);
    if (sel) {
      const r = rngOf(t), rg = document.createElement("div");
      rg.className = "rng";
      rg.style.cssText = `left:${cx(t.x)-r}px;top:${cy(t.y)-r}px;width:${r*2}px;height:${r*2}px`;
      $("world").appendChild(rg);
    }
  }
}

let mobEls = new Map();
let towersHurtLast = false;
function paint() {
  // 몹
  const alive = new Set();
  for (const m of S.mobs) {
    alive.add(m.id);
    let el = mobEls.get(m.id);
    if (!el) {
      el = document.createElement("div");
      el.className = "mob" + (m.boss ? " boss" : "");
      el.innerHTML = `<img class="spr" src="assets/mob/${m.kind}.png" alt=""
          onerror="this.parentNode&amp;&amp;this.parentNode.classList.add('noimg');this.remove()"><i></i>`;
      $("world").appendChild(el);
      mobEls.set(m.id, el);
    }
    const p = mobPos(m), sz = m.boss ? 76 : 44;
    const pct = Math.max(0, m.hp / m.maxHp);
    el.style.cssText = `left:${p.x - sz/2}px;top:${p.y - sz/2}px;width:${sz}px;height:${sz}px`;
    el.classList.toggle("slowed", !!m.slow);
    const bar = el.querySelector("i");
    if (bar) {
      bar.style.width = Math.max(3, sz * 0.8 * pct) + "px";
      bar.style.background = pct > .5 ? "#7fb069" : pct > .25 ? "#e0a458" : "#d05353";
      bar.style.display = pct >= 1 ? "none" : "block";   // 성한 놈에게는 바를 안 그린다
    }
  }
  for (const [id, el] of mobEls) if (!alive.has(id)) { el.remove(); mobEls.delete(id); }

  // 타워 체력바는 매 프레임 바뀐다 — 구성이 그대로여도 여기서 다시 쓴다
  if (S.towers.some(t => t.hp < t.maxHp) || towersHurtLast) {
    towersHurtLast = S.towers.some(t => t.hp < t.maxHp);
    drawTowers();
  }

  // 탄
  document.querySelectorAll("#world .shot").forEach(e => e.remove());
  for (const s of S.shots) {
    const f = 1 - s.life / 0.14;
    const el = document.createElement("div");
    el.className = "shot";
    el.style.cssText = `left:${s.x + (s.tx - s.x) * f}px;top:${s.y + (s.ty - s.y) * f}px;background:${s.col}`;
    $("world").appendChild(el);
  }

  $("hGold").textContent = Math.floor(S.gold);
  $("hLife").textContent = Math.max(0, Math.ceil(S.coreHp)) + "/" + S.coreMax;
  const cb = $("coreBar"), cn = $("coreNum");
  if (cb) cb.style.width = Math.max(0, S.coreHp / S.coreMax * 100) + "%";
  if (cn) cn.textContent = Math.max(0, Math.ceil(S.coreHp));
  $("hRound").textContent = S.round;
  $("hRelic").textContent = META.relics;
  /* **살 수 있으면 살 수 있다고 말해야 한다.** 유물 버튼을 헤더 구석에 조용히 두었더니
     "업그레이드는 한 판 끝나고만 되나"는 물음이 돌아왔다 — 언제든 열린다는 걸 화면이
     한 번도 말한 적이 없었던 것이다. 지금 살 수 있는 게 하나라도 있으면 버튼이 뛴다. */
  const canBuy = Object.keys(UPGRADES).some(k => META.relics >= upCost(k)) ||
                 KIND_IDS.some(k => META.seen[k] && META.relics >= kindCost(k));
  $("relicBtn").classList.toggle("hot", canBuy && !$("over").classList.contains("on"));
  $("relicBtn").title = canBuy ? "쓸 수 있는 유물이 있다 — 눌러서 상점" : "유물 상점";
  $("rollBtn").disabled = S.gold < rollCost() || S.over;
}

/* ══ 패널 ══ */
function refresh() {
  drawTowers();
  $("rollCost").textContent = rollCost();
  /* **자리가 몇 개 남았는지가 늘 보여야 한다.** 그게 이 판의 진짜 제약이고,
     꽉 찼을 때 무엇을 해야 하는지(합치거나 판다)까지 여기서 말해 준다. */
  const waiting = inBox().length;
  $("rollNote").innerHTML =
    `자리 <b>${placed().length}/${slotMax()}</b>` +
    (waiting ? ` · 창고에 <b>${waiting}</b>기 — 칩을 눌러 바꿔 넣는다` : ` · 뽑을수록 값이 오른다`);
  // 이번 판에 나올 것들. 안 보여 주면 "왜 저건 안 나오지"가 답답함으로만 남는다.
  $("poolRow").innerHTML = `<span class="dim">이번 판에 나오는 것</span>` +
    S.pool.map(k => `<span class="pchip" title="${KINDS[k].n} — ${KINDS[k].d}">
      <img src="assets/unit/${k}.png" alt="" onerror="this.parentNode&amp;&amp;this.parentNode.classList.add('noimg');this.remove()">
      <i>${KINDS[k].ico}</i></span>`).join("");
  /* 기다리는 동안에도 버튼은 살아 있다 — 다 됐으면 굳이 셋을 셀 이유가 없다. */
  const resting = !S.running && !S.over && S.auto && S.gap > 0;
  const long  = S.running ? "막는 중…" : resting ? `${S.round}라운드 — 지금 시작` : `${S.round}라운드 시작`;
  const short = S.running ? "막는 중…" : resting ? `${S.round}R 지금` : `${S.round}R 시작`;
  $("waveBtn").textContent = long;
  $("waveBtn").disabled = S.running || S.over;
  $("waveBtn2").textContent = short;
  $("waveBtn2").disabled = S.running || S.over;
  $("autoBtn").classList.toggle("on", S.auto);
  $("autoBtn").title = S.auto ? "웨이브가 알아서 이어진다" : "웨이브를 손으로 시작한다";
  $("runBtn").classList.toggle("on", S.autoRun);
  $("runBtn").title = S.autoRun ? "뽑기·합성까지 알아서 한다" : "뽑기·합성을 손으로 한다";
  const lanes = waveLanes(S.round).length;
  $("waveNote").textContent = S.running
    ? `${S.spawned}/${S.toSpawn} 나옴 · 남은 놈 ${S.mobs.length}`
    : `적 ${waveN(S.round)}마리 · 체력 ${waveHp(S.round)} · ${lanes}갈래에서 온다` +
      (isBossR(S.round) ? " · 큰 놈이 섞인다" : "");

  // **가진 것은 목록이 아니라 진열대로 보여 준다.** 여덟 종이 되고 나니 글 목록은
  // 훑어야 읽히고, 그러면 "뭘 합칠 수 있나"가 한눈에 안 들어온다.
  const m = mergeGroups();
  const cells = [];
  for (const kind of KIND_IDS) for (const g of GRADE) {
    const arr = m.get(kind + ":" + g);
    if (!arr) continue;
    const ready = g < 5 && arr.length >= 3;
    /* **몇 기를 내보냈는지가 칩에 적혀 있어야 한다.** 가진 것과 나가 있는 것이 갈린
       순간부터 "둘 있는데 하나만 싸우는 중"이 늘 벌어진다 — 그게 안 보이면 왜 약한지 모른다. */
    const out = arr.filter(isOut).length;
    cells.push(`<button class="hold${ready ? " ready" : ""}${out ? "" : " away"}" data-hold="${kind}:${g}"
        title="${GNAME[g]} ${KINDS[kind].n} — ${KINDS[kind].d} · 눌러서 내보내거나 거둔다">
      <img class="spr" src="assets/unit/${kind}.png" alt=""
        onerror="this.parentNode&amp;&amp;this.parentNode.classList.add('noimg');this.remove()">
      <span class="ico">${KINDS[kind].ico}</span>
      <span class="cnt">${out}/${arr.length}</span>
      <span class="gr" style="background:${GCOL[g]}"></span></button>`);
  }
  $("tally").innerHTML = cells.join("") || `<div class="note">아직 없다. 먼저 뽑아라.</div>`;
  $("mergeBtn").disabled = !canMerge() || S.over;
  const readyN = [...m.entries()].filter(([k, a]) => +k.split(":")[1] < 5 && a.length >= 3).length;
  $("holdHint").textContent = readyN ? `· ${readyN}가지를 합칠 수 있다` : "";

  const t = S.towers.find(x => x.id === S.sel);
  $("sellBtn").disabled = !t || S.over;
  $("selInfo").innerHTML = t ? `<div class="sel-info">
      <div class="nm" style="color:${GCOL[t.g]}">${GNAME[t.g]} ${KINDS[t.kind].n}</div>
      <div class="st">피해 ${dmgOf(t)} · 사거리 ${rngOf(t)} · ${KINDS[t.kind].d}<br>
        ${isOut(t)
          /* 창고에 있는 것에 "둘레를 0% 덮는다"고 적으면 약해서 0 인 줄 안다. 자리에
             나가 있을 때만 덮는 각을 말하고, 창고에 있으면 그 사실을 말한다. */
          ? `본진 둘레를 ${Math.round(coverOf(t)/24*100)}% 덮는다 · 체력 ${t.hp}/${t.maxHp} · 팔면 ${sellOf(t)}<br>
             <span style="color:var(--steel)">빈 칸을 누르면 그리로 옮긴다.</span>`
          : `<span style="color:var(--amber)">창고에 있다 — 아직 안 싸운다.</span>
             체력 ${t.hp}/${t.maxHp} · 팔면 ${sellOf(t)}<br>
             <span style="color:var(--steel)">진열대의 칩을 누르면 내보낸다.</span>`}</div></div>`
    : `<div class="note helpnote">타워를 누르면 사거리가 보이고, 빈 칸을 누르면 그리로 옮긴다.</div>`;
}

/* 진열대의 칩은 **내보내고 거두는 손잡이**다. 합성은 아래 버튼이 맡는다 —
   한 번 누르는 데 두 가지 뜻이 붙으면 어느 쪽이 일어날지 모른 채 누르게 된다. */
$("tally").addEventListener("click", (e) => {
  const b = e.target.closest("[data-hold]");
  if (!b) return;
  toggleOut(b.dataset.hold);
});
$("rollBtn").onclick = roll;
$("mergeBtn").onclick = merge;
$("sellBtn").onclick = sell;
$("waveBtn").onclick = startWave;
$("waveBtn2").onclick = startWave;
/* ∞ 를 끄면 손으로 시작한다 — 정비를 오래 하고 싶을 때가 있다. 켜고 끄는 건 판을 넘어 남는다. */
/* ⚙ 를 끄면 뽑기·합성을 손으로 한다 — 조합을 직접 짜 보고 싶을 때가 있다. */
$("runBtn").onclick = () => {
  S.autoRun = !S.autoRun;
  try { localStorage.setItem("rtd.autorun", S.autoRun ? "1" : "0"); } catch {}
  refresh();
};
$("autoBtn").onclick = () => {
  S.auto = !S.auto;
  if (S.auto && !S.running && !S.over && S.gap <= 0) S.gap = WAVE_GAP;
  try { localStorage.setItem("rtd.auto", S.auto ? "1" : "0"); } catch {}
  refresh();
};
/** 상점을 연다. **판 도중에도 연다** — 벽에 부딪혔을 때 할 수 있는 게 죽기를 기다리는
 *  것뿐이면 그건 돌파가 아니다. 도중에 열면 게임은 뒤에서 계속 돈다(방치형이니까). */
function openShop(mid) {
  drawShop();
  $("over").classList.toggle("mid", !!mid);
  $("again").textContent = mid ? "계속한다" : "한 판 더";
  if (mid) $("overD").textContent = "막는 동안에도 유물은 쓸 수 있다.";
  $("over").classList.add("on");
}
/** **편성 화면** — 자리에 누가 들어가 있고 창고에 무엇이 남았는지를 한 화면에서 본다.
 *
 *  전장의 진열대 칩으로도 넣고 뺄 수는 있지만, 창고가 열 기를 넘어가면 44px 칩이 빽빽해져
 *  무엇이 있는지조차 안 읽힌다. 자리를 **가로로 늘어놓아** 벙커에 끼운 것을 그대로 세게 하고,
 *  창고는 종류·등급으로 묶어 아래에 크게 편다. 뒤에서 게임은 계속 돈다 — 멈출 이유가 없다.
 *
 *  자리를 누르면 그 대원을 거두고, 창고 칸을 누르면 빈 자리에 내보낸다. */
function drawSquad() {
  const spots = SLOT_SPOTS.slice(0, slotMax());
  const at = new Map(placed().map(t => [t.x + "," + t.y, t]));
  $("sqSlots").innerHTML = spots.map(([x, y]) => {
    const t = at.get(x + "," + y);
    if (!t) return `<div class="sqs empty"><span class="no">+</span></div>`;
    const K = KINDS[t.kind];
    return `<button class="sqs" data-pull="${t.id}" title="${GNAME[t.g]} ${K.n} — 눌러서 거둔다">
      <img class="spr" src="assets/unit/${t.kind}.png" alt=""
        onerror="this.parentNode&amp;&amp;this.parentNode.classList.add('noimg');this.remove()">
      <span class="ico">${K.ico}</span>
      <span class="gr" style="color:${GCOL[t.g]}">${"★".repeat(Math.min(t.g,5))}</span></button>`;
  }).join("");

  const box = new Map();
  for (const t of inBox()) {
    const k = t.kind + ":" + t.g;
    box.set(k, (box.get(k) || 0) + 1);
  }
  $("sqBox").innerHTML = [...box.entries()].map(([k, n]) => {
    const [kind, gs] = k.split(":"), g = +gs, K = KINDS[kind];
    return `<button class="sqb" data-push="${k}" title="${GNAME[g]} ${K.n} — 눌러서 내보낸다">
      <span class="gr" style="background:${GCOL[g]}"></span>
      <img class="spr" src="assets/unit/${kind}.png" alt=""
        onerror="this.parentNode&amp;&amp;this.parentNode.classList.add('noimg');this.remove()">
      <span class="ico">${K.ico}</span>
      <span class="cnt">${n}</span></button>`;
  }).join("") || `<div class="note">창고가 비었다. 뽑으면 여기 쌓인다.</div>`;

  const free = spots.length - at.size;
  $("sqNote").innerHTML = `자리 <b>${at.size}/${spots.length}</b>` +
    (free ? ` · <b style="color:var(--amber)">${free}자리 비었다</b>` : "") +
    ` — 자리를 누르면 거두고, 창고를 누르면 내보낸다`;
  $("sqBoxN").textContent = `${inBox().length}기`;
}
const openSquad = () => { drawSquad(); $("squad").classList.add("on"); };
$("sqClose").onclick = () => $("squad").classList.remove("on");
$("squadBtn").onclick = openSquad;
$("sqSlots").addEventListener("click", (e) => {
  const b = e.target.closest("[data-pull]");
  if (!b) return;
  const t = S.towers.find(x => x.id === +b.dataset.pull);
  if (!t) return;
  t.x = t.y = null;
  if (S.sel === t.id) S.sel = null;
  refresh(); drawSquad();
});
$("sqBox").addEventListener("click", (e) => {
  const b = e.target.closest("[data-push]");
  if (!b) return;
  toggleOut(b.dataset.push);      // 창고에 있으면 내보낸다 — 진열대 칩과 같은 손잡이
  drawSquad();
});
$("relicBtn").onclick = () => openShop(!S.over);
$("dex").addEventListener("click", (e) => {
  const b = e.target.closest("[data-train]");
  if (b) trainKind(b.dataset.train);
});
$("again").onclick = () => {
  if ($("over").classList.contains("mid")) { $("over").classList.remove("on"); refresh(); }
  else newGame();
};
/* ══════════════════════════════════════════════════════════════
   보는 자리 — 끌어서 옮기고, 오므려서 줄인다.
   ──────────────────────────────────────────────────────────────
   판은 13×9 다. 폰 화면에 통째로 욱여넣으면 칸이 30px 까지 줄어 손가락으로 누를 수가
   없고, 조금만 어긋나면 판이 화면 밖으로 나간다 — 실제로 "본진밖에 안 보인다"가 그것이었다.
   그래서 **칸 크기는 고정하고 보는 자리를 움직인다.** 확대하면 칸이 실제로 커진다.

   끌기와 두드리기를 가르는 것이 핵심이다. 손가락이 조금이라도 미끄러지면 배치하려던
   두드림이 끌기로 먹히고, 반대로 문턱이 너무 크면 판이 안 움직인다. 10px·300ms 로 갈랐다.
   ══════════════════════════════════════════════════════════ */
const TAP_SLOP = 10, TAP_MS = 300;
let drag = null, pinch = null;

const dist2 = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
const mid2  = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

$("field").addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    drag = null;
    pinch = { d: dist2(e.touches[0], e.touches[1]), z: V.z };
    return;
  }
  if (e.touches.length === 1) {
    const t = e.touches[0];
    drag = { sx: t.clientX, sy: t.clientY, ox: V.x, oy: V.y, t0: Date.now(), moved: false,
             target: e.target.closest("[data-x]") };
  }
}, { passive: true });

$("field").addEventListener("touchmove", (e) => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const d = dist2(e.touches[0], e.touches[1]), m = mid2(e.touches[0], e.touches[1]);
    zoomAt(m.x, m.y, pinch.z * (d / pinch.d));
    return;
  }
  if (drag && e.touches.length === 1) {
    const t = e.touches[0];
    const dx = t.clientX - drag.sx, dy = t.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < TAP_SLOP) return;   // 아직 두드림일 수 있다
    drag.moved = true;
    e.preventDefault();
    V.x = drag.ox + dx; V.y = drag.oy + dy;
    clampView(); applyView();
  }
}, { passive: false });

$("field").addEventListener("touchend", (e) => {
  if (pinch && e.touches.length < 2) pinch = null;
  if (!drag) return;
  // 짧고 거의 안 움직였으면 두드림이다 — 그 칸을 누른 것으로 친다
  if (!drag.moved && Date.now() - drag.t0 < TAP_MS && drag.target) {
    e.preventDefault();
    drag.target.click();
  }
  drag = null;
}, { passive: false });

// 마우스도 같은 일을 한다 — 휠로 키우고 끌어서 옮긴다
$("field").addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, V.z * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
}, { passive: false });

let mdrag = null;
$("field").addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  mdrag = { sx: e.clientX, sy: e.clientY, ox: V.x, oy: V.y, moved: false };
});
addEventListener("mousemove", (e) => {
  if (!mdrag) return;
  const dx = e.clientX - mdrag.sx, dy = e.clientY - mdrag.sy;
  if (!mdrag.moved && Math.hypot(dx, dy) < TAP_SLOP) return;
  mdrag.moved = true;
  V.x = mdrag.ox + dx; V.y = mdrag.oy + dy;
  clampView(); applyView();
});
addEventListener("mouseup", () => { mdrag = null; });
// 끌고 나서 손을 떼는 순간의 클릭은 배치가 아니다 — 삼켜 준다
$("grid").addEventListener("click", (e) => {
  if (mdrag && mdrag.moved) { e.stopPropagation(); e.preventDefault(); }
}, true);

// 배속 — 1× → 2× → 3× → 1×. 짜 놓은 것이 도는 걸 보는 장르라 기다림이 곧 지루함이다.
$("spdBtn").onclick = () => {
  // 방치형은 **기다림이 곧 지루함**이다. 손을 뗀 채 보는 판이라 배속을 넉넉히 연다.
  S.speed = S.speed >= 6 ? 1 : (S.speed >= 3 ? 6 : S.speed + 1);
  $("spdBtn").textContent = S.speed + "×";
  $("spdBtn").classList.toggle("on", S.speed > 1);
};
addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") $("spdBtn").click(); });

$("fitBtn").onclick = () => {
  // 이미 전체가 보이면 본진으로 돌아온다 — 버튼 하나가 두 일을 하되 뜻이 흔들리지 않는다
  const f = $("field").getBoundingClientRect();
  const whole = Math.min(f.width / WORLD_W, f.height / WORLD_H) * 0.98;
  if (Math.abs(V.z - whole) < 0.02) focusView(); else fitView();
};
$("zinBtn").onclick = () => { const f = $("field").getBoundingClientRect();
  zoomAt(f.left + f.width / 2, f.top + f.height / 2, V.z * 1.25); };
$("zoutBtn").onclick = () => { const f = $("field").getBoundingClientRect();
  zoomAt(f.left + f.width / 2, f.top + f.height / 2, V.z / 1.25); };

addEventListener("resize", () => { clampView(); applyView(); });
addEventListener("orientationchange", () => setTimeout(focusView, 300));
// iOS 는 주소창이 접히며 높이가 변한다 — 처음 한 번 더 맞춰 주지 않으면 판이 잘린 채로 남는다
addEventListener("load", () => setTimeout(focusView, 120));
addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); if (!S.running) startWave(); }
  if (e.key === "r" || e.key === "R") roll();
  if (e.key === "m" || e.key === "M") merge();
});

// 검증 도구용 창구
Object.assign(window, { S, KINDS, GNAME, roll, merge, sell, startWave, refresh, tick, canMerge,
  freeSlots, waveHp, waveN, waveLanes, coreCenter, coreRadius, distToCore, hpOf, coverOf,
  cx, cy, rngOf, dmgOf, buildable, CORE, drawGrid, layout, KIND_IDS, GRADE, mergeGroups,
  V, fitView, focusView, zoomAt, applyView, clampView, CELL, WORLD_W, WORLD_H, mobPos, RING,
  COLS, ROWS, spawnRadius, refreshSlots, slotMax, UPGRADES, kindCost, kindLv, fillFree, inBox, placed });
  // 판 크기와 **자리 수**를 밖에 내준다 — 검증 하네스가 자를 직접 재게

function newGame() {
  refreshSlots();            // 증축한 만큼 자리를 연다 — 판을 시작할 때 한 번
  Object.assign(S, {
    gold: metaGold(), coreHp: metaLife(), coreMax: metaLife(), round: 1, rolls: 0,
    towers: [], mobs: [], shots: [],
    running: false, spawned: 0, toSpawn: 0, spawnT: 0, sel: null, over: false,
    pool: rollPool(), speed: S.speed || 1,      // 배속은 판을 넘어 유지한다
    // 첫 웨이브도 알아서 온다. 다만 처음 한 번은 뽑을 틈이 있어야 하니 조금 길게 준다.
    auto: S.auto, gap: S.auto ? WAVE_GAP * 2.4 : 0,
    autoRun: S.autoRun, autoT: 0,
  });
  mobEls.forEach(el => el.remove()); mobEls.clear();
  // 선발대 — 빈손으로 시작하지 않는다는 감각이 영구 성장의 첫 체감이다
  for (let i = 0; i < META.up.start; i++) {
    // 자리가 모자라도 받기는 받는다 — 창고에 들어갈 뿐이다
    const free = freeSlots();
    const slot = free.length ? free[Math.floor(Math.random() * free.length)] : null;
    const t0 = { id: nextId++, kind: KIND_IDS[Math.floor(Math.random()*KIND_IDS.length)],
                 g: 2, x: slot ? slot.x : null, y: slot ? slot.y : null };
    t0.hp = t0.maxHp = hpOf(t0);
    S.towers.push(t0);
  }
  $("over").classList.remove("on");
  $("log").innerHTML = "";
  refresh();
  say("골드로 <b>뽑고</b>, 같은 것 셋을 <b>합치고</b>, 라운드를 시작해 막는다.");
  say("전투는 알아서 돈다 — 짜 놓은 것이 얼마나 버티는지 보면 된다.");
  if (META.relics || META.best) say(`유물 <b>${META.relics}</b> · 최고 <b>${META.best}</b>라운드`);
}
$("shop").addEventListener("click", (e) => {
  const b = e.target.closest("[data-up]");
  if (!b || b.disabled) return;
  const k = b.dataset.up, c = upCost(k);
  if (META.relics < c) return;
  META.relics -= c; META.up[k]++;
  saveMeta(); drawShop(); paint();
  /* 증축은 **다음 판부터**가 아니라 지금 눈에 보여야 한다. 상점은 판이 끝난 뒤에 열리므로
     여기서 자리를 열어 두면, 새 판이 시작될 때 이미 넓어진 앞마당이 깔려 있다. */
  if (k === "slots") { refreshSlots(); fillFree(); drawGrid(); }
  /* 판 도중에 산 것도 **지금** 들어야 한다. 다음 판부터 세진다면 벽 앞에서 사는 의미가 없다.
     피해·뽑기값은 계산할 때마다 META 를 보므로 저절로 붙고, 체력만 여기서 늘려 준다. */
  if (k === "life" && !S.over) {
    const d = metaLife() - S.coreMax;
    if (d > 0) { S.coreMax += d; S.coreHp += d; }
  }
});
Object.assign(window, { META, newGame, drawShop, relicsFor, upCost, UPGRADES, saveMeta, metaDmg });

layout(); newGame(); requestAnimationFrame(step);
setTimeout(focusView, 60);
</script>
</body>
</html>
